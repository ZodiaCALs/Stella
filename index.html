<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto" data-bg="flow" data-font="serif" data-fs="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameDev Pulse · 游戏开发资讯雷达</title>
<style>
:root{
  --md-primary:#6750A4;--md-on-primary:#fff;--md-primary-container:#EADDFF;--md-on-pc:#21005D;
  --md-secondary-container:#E8DEF8;--md-tertiary-container:#FFD8E4;
  --md-surface:#F7F2FA;--md-surface-2:#EEE7F4;--md-on-surface:#1D1B20;--md-on-surface-var:#49454F;
  --md-outline:rgba(121,116,126,.28);
  --glass-bg:linear-gradient(135deg,rgba(255,255,255,.66),rgba(255,255,255,.38));
  --glass-border:rgba(255,255,255,.65);
  --glass-shadow:0 8px 32px rgba(80,60,140,.14),inset 0 1px 0 rgba(255,255,255,.7);
  --radius-l:28px;--radius-m:20px;--radius-s:14px;
  --blob1:#B39DDB;--blob2:#80DEEA;--blob3:#F48FB1;--blob4:#FFE082;
  --fz:1;
  --t-xs:calc(11.5px*var(--fz));--t-sm:calc(13px*var(--fz));--t-md:calc(14.5px*var(--fz));
  --t-lg:calc(16px*var(--fz));--t-xl:calc(18.5px*var(--fz));
  --ff-body:'Times New Roman','Noto Serif SC',SimSun,'Songti SC',serif;
}
html[data-fs="sm"]{--fz:.86} html[data-fs="lg"]{--fz:1.18}
html[data-font="sans"]{--ff-body:'Manrope','Noto Sans SC',system-ui,sans-serif}
html[data-font="mono"]{--ff-body:ui-monospace,Consolas,'Noto Sans Mono CJK SC',monospace}
[data-theme="dark"]{
  --md-primary:#D0BCFF;--md-on-primary:#381E72;--md-primary-container:#4F378B;--md-on-pc:#EADDFF;
  --md-secondary-container:#4A4458;--md-tertiary-container:#633B48;
  --md-surface:#141218;--md-surface-2:#1D1B20;--md-on-surface:#E6E0E9;--md-on-surface-var:#CAC4D0;
  --md-outline:rgba(147,143,153,.3);
  --glass-bg:linear-gradient(135deg,rgba(40,36,52,.62),rgba(30,27,38,.44));
  --glass-border:rgba(255,255,255,.12);
  --glass-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
  --blob1:#4527A0;--blob2:#006064;--blob3:#880E4F;--blob4:#5D4037;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--ff-body);background:var(--md-surface);color:var(--md-on-surface);
  min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
/* ---- 背景 ---- */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;filter:blur(70px) saturate(1.2)}
.blob{position:absolute;border-radius:50%;opacity:.55;animation:float 22s ease-in-out infinite}
.blob:nth-child(1){width:44vw;height:44vw;background:var(--blob1);top:-12%;left:-8%}
.blob:nth-child(2){width:36vw;height:36vw;background:var(--blob2);top:30%;right:-10%;animation-delay:-6s}
.blob:nth-child(3){width:32vw;height:32vw;background:var(--blob3);bottom:-10%;left:22%;animation-delay:-12s}
.blob:nth-child(4){width:24vw;height:24vw;background:var(--blob4);top:8%;left:48%;animation-delay:-17s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(5vw,-4vh) scale(1.12)}66%{transform:translate(-4vw,5vh) scale(.94)}}
html[data-bg="solid"] .blobs{background:var(--solid,#0F172A);filter:none}
html[data-bg="solid"] .blob{display:none}
/* ---- 纯液态玻璃：高透明 + 强模糊 + 彩色衬底 ---- */
html[data-bg="pure"] .blob{display:none}
html[data-bg="pure"] .blobs{filter:none;background:
  radial-gradient(900px 520px at 8% 0%,rgba(179,157,219,.5),transparent 62%),
  radial-gradient(820px 520px at 96% 18%,rgba(128,222,234,.42),transparent 62%),
  radial-gradient(950px 640px at 50% 105%,rgba(244,143,177,.4),transparent 62%),
  linear-gradient(180deg,var(--md-surface),var(--md-surface-2))}
html[data-bg="pure"][data-theme="dark"] .blobs{background:
  radial-gradient(900px 520px at 8% 0%,rgba(69,39,160,.6),transparent 62%),
  radial-gradient(820px 520px at 96% 18%,rgba(0,96,100,.55),transparent 62%),
  radial-gradient(950px 640px at 50% 105%,rgba(136,14,79,.5),transparent 62%),
  linear-gradient(180deg,var(--md-surface),var(--md-surface-2))}
html[data-bg="pure"]{
  --glass-bg:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.05) 55%,rgba(255,255,255,.13));
  --glass-border:rgba(255,255,255,.42);
  --glass-shadow:0 12px 42px rgba(70,55,130,.16),inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 26px rgba(255,255,255,.07)}
html[data-bg="pure"][data-theme="dark"]{
  --glass-bg:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 55%,rgba(255,255,255,.07));
  --glass-border:rgba(255,255,255,.22);
  --glass-shadow:0 12px 42px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 26px rgba(255,255,255,.04)}
html[data-bg="pure"] .glass{-webkit-backdrop-filter:blur(34px) saturate(1.9);backdrop-filter:blur(34px) saturate(1.9)}
/* 透明度提升：卡片背景大幅淡化 */
html[data-bg="pure"] .card,html[data-bg="pure"] .hero,html[data-bg="pure"] .toolbar,
html[data-bg="pure"] .reader-panel,html[data-bg="pure"] .modal{
  background:rgba(255,255,255,.13)}
html[data-bg="pure"][data-theme="dark"] .card,html[data-bg="pure"][data-theme="dark"] .hero,
html[data-bg="pure"][data-theme="dark"] .toolbar,html[data-bg="pure"][data-theme="dark"] .reader-panel,
html[data-bg="pure"][data-theme="dark"] .modal{background:rgba(28,25,38,.15)}
/* 全组件玻璃化 */
html[data-bg="pure"] .chip,html[data-bg="pure"] .bucket,html[data-bg="pure"] .pg-btn,
html[data-bg="pure"] .reset-btn,html[data-bg="pure"] .icon-btn,html[data-bg="pure"] .search,
html[data-bg="pure"] .opt,html[data-bg="pure"] .field input,html[data-bg="pure"] .back-btn,
html[data-bg="pure"] .ai-badge,html[data-bg="pure"] .r-meta .pill,html[data-bg="pure"] .link,
html[data-bg="pure"] .fab,html[data-bg="pure"] .btn,html[data-bg="pure"] .r-link,
html[data-bg="pure"] .cat-tag,html[data-bg="pure"] .stat{
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);
  border:1px solid var(--glass-border);color:var(--md-on-surface)}
html[data-bg="pure"] .bucket{background:rgba(255,255,255,.10)}
html[data-bg="pure"][data-theme="dark"] .bucket{background:rgba(255,255,255,.06)}
.glass{background:var(--glass-bg);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
/* ---- 顶栏 ---- */
header{position:sticky;top:14px;z-index:50;margin:14px auto 0;max-width:1180px;display:flex;align-items:center;
  gap:12px;padding:12px 20px;border-radius:999px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:var(--t-xl)}
.logo .dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(135deg,var(--md-primary),#9C27B0);color:#fff}
.logo small{display:block;font-size:var(--t-xs);font-weight:600;color:var(--md-on-surface-var)}
header .spacer{flex:1}
#lastUpdated{font-size:var(--t-xs);color:var(--md-on-surface-var);white-space:nowrap}
.icon-btn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:17px;display:grid;
  place-items:center;background:var(--md-secondary-container);color:var(--md-on-surface);transition:.2s}
.icon-btn:hover{transform:scale(1.08)}
.icon-btn.lang{font-size:13px;font-weight:800;width:auto;padding:0 14px;border-radius:999px;height:42px}
.fab{border:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700;font-size:var(--t-md);
  padding:0 20px;height:48px;border-radius:16px;color:var(--md-on-primary);font-family:inherit;
  background:linear-gradient(135deg,var(--md-primary),#8E6FD8);transition:.2s}
.fab:hover{transform:translateY(-2px)}
.fab.alt{background:linear-gradient(135deg,#E91E63,#FF7043)}
.fab .ic{display:inline-block}
.fab.loading .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
/* ---- AI 速览 ---- */
.hero{border-radius:var(--radius-l);padding:26px 28px;margin-bottom:20px}
.hero-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero-top h1{font-size:calc(clamp(22px,3vw,30px)*var(--fz));font-weight:800;display:flex;align-items:center;gap:10px}
.ai-badge{font-size:var(--t-xs);font-weight:700;padding:5px 12px;border-radius:999px;
  background:var(--md-primary-container);color:var(--md-on-pc)}
.hero .spacer{flex:1}
.ai-summary{font-size:var(--t-md);line-height:1.75;color:var(--md-on-surface-var);margin:12px 0 18px}
.digest{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}
.bucket{border-radius:var(--radius-m);padding:16px;background:var(--md-secondary-container);border:1px solid var(--md-outline)}
.bucket h4{font-size:var(--t-md);font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.bucket .cnt{margin-left:auto;font-size:var(--t-xs);color:var(--md-on-surface-var)}
.bucket ul{list-style:none}
.bucket li{font-size:var(--t-sm);line-height:1.5;margin-bottom:9px}
.bucket .brow{display:flex;align-items:flex-start;gap:6px}
.bucket a.btitle{color:var(--md-on-surface);text-decoration:none;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bucket a.btitle:hover{color:var(--md-primary)}
.bucket a.bext{color:var(--md-primary);text-decoration:none;font-weight:700;flex:none}
.bucket .bsrc{display:block;font-size:var(--t-xs);color:var(--md-on-surface-var);margin-top:2px}
.plat{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:5px;vertical-align:1px}
.plat.bili{background:#FB7299;color:#fff}.plat.yt{background:#FF0000;color:#fff}.plat.media{background:#64748B;color:#fff}
.digest-empty{font-size:var(--t-sm);color:var(--md-on-surface-var)}
/* ---- 筛选 ---- */
.toolbar{display:flex;flex-direction:column;gap:12px;border-radius:var(--radius-m);padding:16px 18px;margin-bottom:22px}
.src-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.group-label{font-size:var(--t-xs);font-weight:700;color:var(--md-on-surface-var);min-width:62px;flex:none}
.chip{border:1px solid var(--md-outline);background:transparent;color:var(--md-on-surface-var);
  padding:7px 14px;border-radius:12px;font-size:var(--t-sm);font-weight:600;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:7px;transition:.18s;user-select:none}
.chip:hover{background:var(--md-surface-2)}
.chip.active{background:var(--md-primary);color:#fff;border-color:transparent}
[data-theme="dark"] .chip.active{color:#381E72}
.src-dot{width:9px;height:9px;border-radius:50%;flex:none}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px}
.search input{border:none;outline:none;background:transparent;color:var(--md-on-surface);font-family:inherit;font-size:var(--t-sm);width:160px}
.reset-btn{border:none;background:var(--md-tertiary-container);color:var(--md-on-surface);font-family:inherit;
  font-weight:700;font-size:var(--t-sm);padding:8px 16px;border-radius:999px;cursor:pointer}
/* ---- 卡片 ---- */
.grid{display:flex;flex-direction:column;gap:18px}
.card{border-radius:var(--radius-m);overflow:hidden;display:grid;grid-template-columns:280px 1fr;min-height:172px;
  cursor:pointer;transition:transform .28s,box-shadow .28s;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 44px rgba(80,60,140,.22)}
.thumb{position:relative;overflow:hidden;background:var(--md-surface-2);min-height:172px}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:transform .5s}
.card:hover .thumb img{transform:scale(1.06)}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;
  background:linear-gradient(135deg,var(--md-primary-container),var(--md-tertiary-container))}
.cat-tag{position:absolute;right:12px;top:12px;padding:5px 12px;border-radius:999px;font-size:var(--t-xs);
  font-weight:700;background:var(--md-primary);color:#fff}
[data-theme="dark"] .cat-tag{color:#381E72}
.body{padding:18px 22px;display:flex;flex-direction:column;gap:9px;min-width:0}
.meta{display:flex;align-items:center;gap:8px;font-size:var(--t-xs);color:var(--md-on-surface-var);font-weight:600}
.meta .time{margin-left:auto}
.meta .heat{color:#FF5722}
.card h3{font-size:var(--t-xl);line-height:1.45;font-weight:700;color:var(--md-on-surface);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card:hover h3{color:var(--md-primary)}
.summary{font-size:var(--t-md);line-height:1.7;color:var(--md-on-surface-var);flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;align-items:center;justify-content:space-between}
.link{font-size:var(--t-sm);font-weight:700;color:var(--md-primary);padding:7px 16px;border-radius:999px;
  background:color-mix(in srgb,var(--md-primary) 12%,transparent)}
/* ---- 阅读 ---- */
.reader-panel{border-radius:var(--radius-l);padding:30px 36px 40px;max-width:860px;margin:0 auto;animation:fadeUp .45s ease both}
.back-btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-family:inherit;
  font-weight:700;font-size:var(--t-sm);color:var(--md-on-surface);background:var(--md-secondary-container);
  padding:9px 18px;border-radius:999px;margin-bottom:22px;transition:.2s}
.back-btn:hover{background:var(--md-primary);color:#fff}
.r-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:var(--t-sm);font-weight:600;color:var(--md-on-surface-var)}
.r-meta .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;background:var(--md-secondary-container);color:var(--md-on-surface)}
#rTitle{font-size:calc(clamp(24px,3.6vw,36px)*var(--fz));line-height:1.3;font-weight:800;margin-bottom:12px}
.r-link{display:flex;gap:8px;font-size:var(--t-sm);color:var(--md-primary);font-weight:600;text-decoration:none;
  padding:10px 16px;border-radius:var(--radius-s);margin-bottom:22px;word-break:break-all;
  background:color-mix(in srgb,var(--md-primary) 10%,transparent)}
.r-figure{margin:0 0 26px;border-radius:var(--radius-m);overflow:hidden;background:var(--md-surface-2)}
.r-figure img{width:100%;display:block;max-height:440px;object-fit:cover}
.r-figure .ph{height:240px;display:grid;place-items:center;font-size:64px;
  background:linear-gradient(135deg,var(--md-primary-container),var(--md-tertiary-container))}
#rBody{font-size:var(--t-lg);line-height:1.9}
#rBody p{margin-bottom:1.1em;color:var(--md-on-surface-var)}
.r-open{display:inline-flex;gap:8px;margin-top:18px;font-size:var(--t-md);font-weight:700;color:#fff;text-decoration:none;
  padding:13px 28px;border-radius:999px;background:linear-gradient(135deg,var(--md-primary),#8E6FD8)}
/* ---- 翻页 ---- */
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:26px;flex-wrap:wrap}
.page-info{font-size:var(--t-sm);color:var(--md-on-surface-var);margin-right:8px}
.pg-btn{min-width:40px;height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--md-outline);
  background:transparent;color:var(--md-on-surface-var);font-family:inherit;font-weight:700;font-size:var(--t-sm);cursor:pointer;transition:.18s}
.pg-btn:hover:not(:disabled){background:var(--md-surface-2);color:var(--md-on-surface)}
.pg-btn.cur{background:var(--md-primary);color:#fff;border-color:transparent}
[data-theme="dark"] .pg-btn.cur{color:#381E72}
.pg-btn:disabled{opacity:.35;cursor:not-allowed}
/* ---- 弹窗 ---- */
.modal-mask{position:fixed;inset:0;background:rgba(15,12,24,.45);z-index:98;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:var(--radius-l);padding:26px 28px;animation:fadeUp .3s ease both}
.modal h2{font-size:var(--t-xl);margin-bottom:4px}
.modal .sub{font-size:var(--t-xs);color:var(--md-on-surface-var);margin-bottom:18px}
.opt-group{margin-bottom:20px}
.opt-group>label{display:block;font-size:var(--t-sm);font-weight:700;color:var(--md-on-surface-var);margin-bottom:10px}
.opt-row{display:flex;gap:9px;flex-wrap:wrap}
.opt{border:1px solid var(--md-outline);background:transparent;color:var(--md-on-surface);font-family:inherit;
  padding:9px 15px;border-radius:12px;font-size:var(--t-sm);font-weight:600;cursor:pointer;transition:.18s}
.opt:hover{background:var(--md-surface-2)}
.opt.active{background:var(--md-primary);color:#fff;border-color:transparent}
[data-theme="dark"] .opt.active{color:#381E72}
.color-row{display:flex;align-items:center;gap:12px;margin-top:12px}
.color-row input[type=color]{width:52px;height:52px;border:none;border-radius:14px;cursor:pointer;background:none;padding:0}
.color-row input[type=color]::-webkit-color-swatch{border-radius:14px;border:2px solid var(--md-outline)}
.color-row input[type=text]{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--md-outline);
  background:var(--md-surface-2);color:var(--md-on-surface);font-family:inherit;font-size:var(--t-sm);outline:none;text-transform:uppercase}
.field{margin-bottom:12px}
.field span{display:block;font-size:var(--t-xs);color:var(--md-on-surface-var);margin-bottom:6px}
.field input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--md-outline);background:var(--md-surface-2);
  color:var(--md-on-surface);font-family:inherit;font-size:var(--t-sm);outline:none}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.btn{border:none;font-family:inherit;font-weight:700;font-size:var(--t-sm);padding:11px 22px;border-radius:999px;cursor:pointer}
.btn.primary{background:var(--md-primary);color:#fff}
.btn.ghost{background:var(--md-secondary-container);color:var(--md-on-surface)}
.poster-modal{max-width:420px;text-align:center}
#posterPreview{width:100%;max-width:330px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);margin:10px auto;display:block}
.poster-status{font-size:var(--t-xs);color:var(--md-on-surface-var);margin-bottom:10px;min-height:18px}
/* ---- 骨架/Toast ---- */
.skel{border-radius:var(--radius-m);overflow:hidden;display:grid;grid-template-columns:280px 1fr;min-height:172px}
.skel .s-img,.skel .s-line{background:linear-gradient(90deg,var(--md-surface-2) 25%,var(--md-surface) 50%,var(--md-surface-2) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
.skel .s-lines{padding:20px 24px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.skel .s-line{height:14px;border-radius:7px}
.skel .s-line.w40{width:40%}.skel .s-line.w90{width:88%}.skel .s-line.w70{width:68%}
@keyframes shimmer{to{background-position:-200% 0}}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);padding:13px 24px;border-radius:999px;
  font-size:var(--t-sm);font-weight:600;z-index:99;background:var(--md-on-surface);color:var(--md-surface);opacity:0;
  transition:.35s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:60px 20px;color:var(--md-on-surface-var)}
.empty .big{font-size:52px;margin-bottom:14px}
footer{text-align:center;font-size:var(--t-xs);color:var(--md-on-surface-var);padding:20px;opacity:.7}
@media(max-width:720px){
  header{flex-wrap:wrap;border-radius:var(--radius-l)}
  #lastUpdated{display:none}
  .card,.skel{grid-template-columns:1fr}
  .thumb{min-height:160px;aspect-ratio:16/9}
  .skel .s-img{height:150px}
  .search{margin-left:0;width:100%}
  .search input{width:100%}
  .reader-panel{padding:22px 20px 32px}
}
</style>
</head>
<body>

 {key:'studio',match:it=>/工作室|裁员|收购|融资|解散|关停|离职|studio|layoff|acqui|shut(s|ting)? ?down|closes|union|funding/i.test(it.title+' '+it.summary)},
];
const SRC_MAP=Object.fromEntries(SOURCES.map(s=>[s.name,s]));
const CACHE_KEY='gamedev_pulse_v5',CLICK_KEY='gdv_clicks_v1',PER_SOURCE=12,PAGE_SIZE=10,FETCH_TIMEOUT=8000;

/* ================= 工具 ================= */
function hashCode(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0}return Math.abs(h)}
function decodeEntities(s){const d=document.createElement('textarea');d.innerHTML=s;return d.value}
function relTime(ts){const diff=Date.now()-ts;
  if(diff<36e5)return tf('time.min',Math.max(1,Math.round(diff/6e4)));
  if(diff<864e5)return tf('time.hour',Math.round(diff/36e5));
  return tf('time.day',Math.round(diff/864e5))}
function fmtNum(n){
  if(LANG==='en'){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n||0)}
  if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e4)return(n/1e4).toFixed(1)+'万';return String(n||0)}
function dateStr(ts){return new Date(ts).toLocaleDateString(LANG==='zh'?'zh-CN':'en-US',{year:'numeric',month:'long',day:'numeric'})}
function isGn(link){return /news\.google\.com\/rss\/articles/.test(link)}
function decodeGnLink(url){
  try{const m=url.match(/articles\/(.+)$/);if(!m)return url;
    let s=m[1].replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';
    const raw=atob(s);const found=raw.match(/https?:\/\/(?!news\.google\.com)[^\s"'<>]+/);
    return found?found[0]:url;
  }catch(e){return url}}
function trackClick(id){CLICKS[id]=(CLICKS[id]||0)+1;
  try{localStorage.setItem(CLICK_KEY,JSON.stringify(CLICKS))}catch(e){}}
function heatOf(it){return(it.views||0)+(CLICKS[it.id]||0)*200}
function isDarkMode(){const th=document.documentElement.dataset.theme;
  if(th==='dark')return true;if(th==='light')return false;
  return matchMedia('(prefers-color-scheme: dark)').matches}
let toastTimer;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}

/* ================= 网络 ================= */
async function fetchTextFast(rawUrl){
  const local=rawUrl.startsWith('/');
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),local?15000:FETCH_TIMEOUT);
  try{
    const builders=local?[u=>u]:PROXY_BUILD;
    return await Promise.any(builders.map(wrap=>
      fetch(wrap(rawUrl),{signal:ctrl.signal})
        .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
        .then(t=>{if(!t||!t.trim().startsWith('<'))throw new Error('bad');return t})));
  }finally{clearTimeout(timer);try{ctrl.abort()}catch(e){}}
}
async function fetchSource(src){
  try{return parseFeed(await Promise.any(src.urls.map(fetchTextFast)),src)}
  catch(e){return []}
}

/* ================= 解析 ================= */
function firstText(node,names){for(const n of names){const el=node.getElementsByTagName(n)[0];
  if(el&&el.textContent.trim())return el}return null}
function extractImage(node,contentHtml){
  const mc=node.getElementsByTagName('media:content')[0]||node.querySelector('content[url]');
  if(mc&&mc.getAttribute('url'))return mc.getAttribute('url');
  const mt=node.getElementsByTagName('media:thumbnail')[0];
  if(mt&&mt.getAttribute('url'))return mt.getAttribute('url');
  for(const e of node.getElementsByTagName('enclosure')){
    const u=e.getAttribute('url'),tp=e.getAttribute('type')||'';
    if(u&&(tp.startsWith('image')||/\.(jpe?g|png|webp|gif)(\?|$)/i.test(u)))return u;
  }
  if(contentHtml){const m=contentHtml.match(/<img[^>]+src=["']([^"']+)["']/i);if(m)return m[1]}
  return '';
}
function extractViews(node,content){
  const st=node.getElementsByTagName('media:statistics')[0];
  if(st&&st.getAttribute('views'))return parseInt(st.getAttribute('views'))||0;
  const m=(content||'').match(/播放[量]?\s*[:：]?\s*([\d.]+)\s*(万)?/);
  if(m)return m[2]?Math.round(parseFloat(m[1])*10000):parseInt(m[1]);
  return 0;
}
function parseFeed(xml,src){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  if(doc.querySelector('parsererror'))throw new Error('parse');
  let nodes=[...doc.getElementsByTagName('item')];
  if(!nodes.length)nodes=[...doc.getElementsByTagName('entry')];
  const out=[];
  for(const node of nodes.slice(0,PER_SOURCE)){
    const titleEl=firstText(node,['title']);
    const ytId=node.getElementsByTagName('yt:videoId')[0];
    const linkEl=node.querySelector('link:not([rel])')||node.getElementsByTagName('link')[0];
    let link=ytId?('https://www.youtube.com/watch?v='+ytId.textContent.trim())
      :(linkEl?(linkEl.getAttribute('href')||linkEl.textContent).trim():'');
    let title=decodeEntities((titleEl?titleEl.textContent:'').trim());
    if(!title||!link)continue;
    if(isGn(link)){title=title.replace(/\s+-\s+[^-]{1,40}$/,'');link=decodeGnLink(link)}
    const dateEl=firstText(node,['pubDate','published','updated','dc:date']);
    const descEl=firstText(node,['content:encoded','description','summary','content']);
    const content=descEl?descEl.textContent:'';
    const date=dateEl?new Date(dateEl.textContent.trim()):new Date();
    const text=(title+' '+content).toLowerCase();
    const cat=src.gacha?'gacha':((CAT_RULES.find(([,re])=>re.test(text))||['misc'])[0]);
    out.push({
      id:'a'+hashCode(link),title,link,cat,content,
      summary:decodeEntities(content).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim().slice(0,200),
      image:extractImage(node,content),views:extractViews(node,content),
      date:isNaN(date)?Date.now():date.getTime(),
      source:src.name,gacha:!!src.gacha,plat:src.plat||'',
    });
  }
  return out;
}

async function refresh(silent){
  const btn=document.getElementById('refreshBtn');
  btn.classList.add('loading');btn.disabled=true;
  if(!silent)showSkeleton();
  const t0=performance.now();
  const results=await Promise.all(SOURCES.map(fetchSource));
  const seen=new Set(),now=Date.now();
  ALL=results.flat().filter(it=>{const k=it.link.split(/[?#]/)[0];
    if(seen.has(k))return false;seen.add(k);
    return now-it.date<21*864e5}).sort((a,b)=>b.date-a.date).slice(0,220);
  const okCount=results.filter(r=>r.length).length;
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({time:now,items:ALL}))}catch(e){}
  document.getElementById('lastUpdated').textContent=t('updated')+
    new Date(now).toLocaleTimeString(LANG==='zh'?'zh-CN':'en-US',{hour:'2-digit',minute:'2-digit'});
  const sec=((performance.now()-t0)/1000).toFixed(1);
  render();buildAISummary();
  btn.classList.remove('loading');btn.disabled=false;
  if(ALL.length)toast(silent?tf('toast.bg',ALL.length,sec):tf('toast.done',ALL.length,okCount,SOURCES.length,sec));
  else toast(t('toast.fail'));
}

function genPageNums(cur,total){
  if(total<=7)return Array.from({length:total},(_,i)=>i+1);
  const set=new Set([1,2,total-1,total,cur-1,cur,cur+1]);
  const arr=[...set].filter(n=>n>=1&&n<=total).sort((a,b)=>a-b);
  const out=[];let prev=0;
  for(const n of arr){if(n-prev>1)out.push('…');out.push(n);prev=n}
  return out;
}
function renderPagination(count,totalPages){
  const pg=document.getElementById('pagination');pg.innerHTML='';

  const mkBtn=(label,target,disabled,cur)=>{
    const b=document.createElement('button');b.className='pg-btn'+(cur?' cur':'');
    b.textContent=label;b.disabled=disabled;
    if(!disabled&&!cur)b.onclick=()=>{page=target;render();window.scrollTo({top:0,behavior:'smooth'})};
    return b;
  };
  pg.appendChild(mkBtn('«',1,page===1));
  pg.appendChild(mkBtn('‹',page-1,page===1));
  genPageNums(page,totalPages).forEach(n=>{
    if(n==='…'){const s=document.createElement('span');s.textContent='…';pg.appendChild(s)}
    else pg.appendChild(mkBtn(n,n,false,n===page));

}

function fitLines(ctx,text,maxW,maxLines){
  const lines=[];let cur='';
  for(const ch of [...text]){
    if(ctx.measureText(cur+ch).width<=maxW){cur+=ch;continue}
    if(lines.length===maxLines-1){
      while(cur&&ctx.measureText(cur+'…').width>maxW)cur=cur.slice(0,-1);
      lines.push(cur+'…');return lines;
    }
    lines.push(cur);cur=ch;
  }
  if(cur)lines.push(cur);
  return lines;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

  const W=1080,PAD=64,CW=W-PAD*2;
  const FS='"Times New Roman","Noto Serif SC",SimSun,serif';
  const FN='"Manrope","Noto Sans SC",sans-serif';
  const mc=document.createElement('canvas').getContext('2d');
  mc.font='800 44px '+FS;const heroTitleLines=fitLines(mc,top[0].title,CW-190,3).length;
  const heroH=Math.max(180,(heroImg?200:0)+heroTitleLines*56+58);
  const itemHs=top.slice(1).map(it=>{
    mc.font='700 33px '+FN;return 40+fitLines(mc,it.title,CW-150,2).length*46+44;
  });
  mc.font='800 50px '+FS;const sloganH=slogan?fitLines(mc,slogan,CW,2).length*64+8:0;
  mc.font='400 27px '+FN;const leadH=lead?fitLines(mc,lead,CW,2).length*40+8:0;
  const H=64+150+sloganH+leadH+30+heroH+26
    +itemHs.reduce((a,b)=>a+b+18,0)+90;
  /* ---- 绘制 ---- */
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  const fg=dark?'#EDE8F5':'#1D1B20',sub=dark?'#BDB4CE':'#49454F';
  const cardBg=dark?'rgba(255,255,255,.07)':'rgba(255,255,255,.62)';
  const cardBd=dark?'rgba(255,255,255,.14)':'rgba(255,255,255,.95)';
  const g=ctx.createLinearGradient(0,0,W,H);
  if(dark){g.addColorStop(0,'#1E1B2E');g.addColorStop(.45,'#2A1B4A');g.addColorStop(1,'#0F172A')}
  else{g.addColorStop(0,'#EADDFF');g.addColorStop(.45,'#F7F2FA');g.addColorStop(1,'#D6E3F5')}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  [[150,160,320],[940,380,280],[200,H*.7,340],[900,H*.85,300]].forEach((d,i)=>{
    const cols=['rgba(208,188,255,','rgba(233,30,99,','rgba(128,222,234,','rgba(255,224,130,'];
    const rg=ctx.createRadialGradient(d[0],d[1],0,d[0],d[1],d[2]);
    rg.addColorStop(0,cols[i]+(dark?'.20)':'.18)'));rg.addColorStop(1,'transparent');
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(d[0],d[1],d[2],0,7);ctx.fill();
  });
  const bar=ctx.createLinearGradient(0,0,W,0);
  bar.addColorStop(0,'#6750A4');bar.addColorStop(.5,'#E91E63');bar.addColorStop(1,'#FF9800');
  ctx.fillStyle=bar;ctx.fillRect(0,0,W,14);
  ctx.textBaseline='top';
  /* 头部 */
  let y=64;
  ctx.fillStyle='#6750A4';roundRect(ctx,PAD,y,12,118,6);ctx.fill();
  ctx.fillStyle=fg;ctx.font='800 62px '+FS;ctx.fillText('GameDev Pulse',PAD+34,y+4);
  ctx.fillStyle=sub;ctx.font='600 30px '+FN;ctx.fillText(t('poster.kicker'),PAD+34,y+80);
  ctx.textAlign='right';
  ctx.fillStyle=sub;ctx.font='600 28px '+FN;ctx.fillText(dateStr(Date.now()),W-PAD,y+10);
  ctx.font='800 40px '+FN;ctx.fillStyle=dark?'#D0BCFF':'#6750A4';ctx.fillText(t('poster.top'),W-PAD,y+52);
  ctx.textAlign='left';
  y+=150;
  /* AI 文案 */
  if(slogan){ctx.font='800 50px '+FS;ctx.fillStyle=fg;
    fitLines(ctx,slogan,CW,2).forEach(ln=>{ctx.fillText(ln,PAD,y);y+=64});y+=8}
  if(lead){ctx.font='400 27px '+FN;ctx.fillStyle=sub;
    fitLines(ctx,lead,CW,2).forEach(ln=>{ctx.fillText(ln,PAD,y);y+=40});y+=8}
  ctx.strokeStyle=dark?'rgba(255,255,255,.12)':'rgba(29,27,32,.12)';
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(PAD,y);ctx.lineTo(W-PAD,y);ctx.stroke();
  y+=30;
  /* TOP1 大卡 */
  const hero=top[0],hc=CAT_COLORS[hero.cat]||'#6750A4';
  ctx.fillStyle=cardBg;roundRect(ctx,PAD,y,CW,heroH,26);ctx.fill();
  ctx.strokeStyle=cardBd;ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle=hc;roundRect(ctx,PAD,y,10,heroH,5);ctx.fill();
  let tx=PAD+36;
  if(heroImg){
    const iw=240,ih=150,ix=PAD+36,iy=y+25;
    ctx.save();roundRect(ctx,ix,iy,iw,ih,16);ctx.clip();
    const sc2=Math.max(iw/heroImg.width,ih/heroImg.height);
    ctx.drawImage(heroImg,ix+(iw-heroImg.width*sc2)/2,iy+(ih-heroImg.height*sc2)/2,heroImg.width*sc2,heroImg.height*sc2);
    ctx.restore();
    tx=ix+iw+28;
  }
  ctx.fillStyle=hc;roundRect(ctx,tx,y+26,150,44,22);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='700 26px '+FN;ctx.textAlign='center';
  ctx.fillText(t('cat.'+hero.cat),tx+75,y+37);ctx.textAlign='left';
  ctx.fillStyle=fg;ctx.font='800 44px '+FS;
  fitLines(ctx,hero.title,CW-(tx-PAD)-36,3).forEach((ln,i)=>ctx.fillText(ln,tx,y+88+i*56));
  ctx.fillStyle=sub;ctx.font='600 26px '+FN;
  const metaY=heroImg?y+heroH-52:y+88+heroTitleLines*56+8;
  ctx.fillText('🥇 '+hero.source+' · '+dateStr(hero.date)+(hero.views?' · ▶ '+fmtNum(hero.views):''),
    tx,Math.min(metaY,y+heroH-52));
  y+=heroH+26;
  /* 2~5 条目 */
  top.slice(1).forEach((it,i)=>{
    const h=itemHs[i],c=CAT_COLORS[it.cat]||'#64748B';
    ctx.fillStyle=cardBg;roundRect(ctx,PAD,y,CW,h,20);ctx.fill();
    ctx.strokeStyle=cardBd;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=c;roundRect(ctx,PAD+22,y+26,52,52,14);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='800 30px '+FN;ctx.textAlign='center';
    ctx.fillText(String(i+2),PAD+48,y+36);ctx.textAlign='left';
    ctx.fillStyle=fg;ctx.font='700 33px '+FN;
    fitLines(ctx,it.title,CW-150,2).forEach((ln,li)=>ctx.fillText(ln,PAD+96,y+28+li*46));
    ctx.fillStyle=sub;ctx.font='600 24px '+FN;
    ctx.fillText(it.source+' · '+t('cat.'+it.cat)+' · '+dateStr(it.date)+
      (it.views?' · ▶ '+fmtNum(it.views):''),PAD+96,y+h-42);
    y+=h+18;
  });
  ctx.fillStyle=sub;ctx.font='600 26px '+FN;ctx.textAlign='center';
  ctx.fillText(t('poster.footer'),W/2,H-64);
  ctx.textAlign='left';
  const dataUrl=cv.toDataURL('image/png');
  const pv=document.getElementById('posterPreview');
  pv.src=dataUrl;pv.dataset.url=dataUrl;
  status.textContent=slogan?t('poster.done.ai'):t('poster.done');
}
document.getElementById('posterBtn').onclick=generatePoster;
document.getElementById('posterRegen').onclick=generatePoster;
document.getElementById('posterClose').onclick=()=>document.getElementById('posterModal').classList.remove('show');
document.getElementById('posterDownload').onclick=()=>{
  const a=document.createElement('a');
  a.href=document.getElementById('posterPreview').dataset.url;
  a.download='gamedev_poster_'+Date.now()+'.png';a.click();
  toast(t('toast.dl'));
};

/* ================= 外观设置 ================= */
function luminance(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return(0.299*r+0.587*g+0.114*b)/255;
}
function applyAppearance(cfg){
  const root=document.documentElement;
  root.dataset.bg=cfg.bg||'flow';
  root.dataset.font=cfg.font||'serif';
  root.dataset.fs=cfg.fs||'md';
  if(cfg.solid)root.style.setProperty('--solid',cfg.solid);
  if(cfg.bg==='solid'&&cfg.solid)applyTheme(luminance(cfg.solid)>0.6?'light':'dark');
}
function loadSettings(){
  let cfg={};try{cfg=JSON.parse(localStorage.getItem('gdv_appearance')||'{}')}catch(e){}
  if(!cfg.bg)cfg.bg='flow';if(!cfg.font)cfg.font='serif';if(!cfg.fs)cfg.fs='md';
  if(!cfg.solid)cfg.solid='#0F172A';
  applyAppearance(cfg);return cfg;
}
function markOpts(cfg){
  document.querySelectorAll('#bgOpts .opt').forEach(b=>b.classList.toggle('active',b.dataset.bg===cfg.bg));
  document.querySelectorAll('#fontOpts .opt').forEach(b=>b.classList.toggle('active',b.dataset.font===cfg.font));
  document.querySelectorAll('#fsOpts .opt').forEach(b=>b.classList.toggle('active',b.dataset.fs===cfg.fs));
  document.getElementById('colorRow').style.display=cfg.bg==='solid'?'flex':'none';
  document.getElementById('colorWheel').value=cfg.solid;
  document.getElementById('colorHex').value=cfg.solid;
}
function saveCfg(patch){
  const cfg=loadSettings();Object.assign(cfg,patch);
  localStorage.setItem('gdv_appearance',JSON.stringify(cfg));
  applyAppearance(cfg);markOpts(cfg);return cfg;
}
function openSettings(){
  const cfg=loadSettings();
  const ai=JSON.parse(localStorage.getItem('gdv_ai')||'{}');
  document.getElementById('aiUrl').value=ai.base||'';
  document.getElementById('aiKey').value=ai.key||'';
  document.getElementById('aiModel').value=ai.model||'';
  markOpts(cfg);
  document.getElementById('settingsModal').classList.add('show');
}
document.getElementById('settingsBtn').onclick=openSettings;
document.getElementById('settingsClose').onclick=()=>document.getElementById('settingsModal').classList.remove('show');
document.getElementById('settingsModal').onclick=e=>{if(e.target.id==='settingsModal')e.target.classList.remove('show')};
document.getElementById('bgOpts').onclick=e=>{
  const b=e.target.closest('.opt');if(b)saveCfg({bg:b.dataset.bg});
};
document.getElementById('fontOpts').onclick=e=>{
  const b=e.target.closest('.opt');if(b)saveCfg({font:b.dataset.font});
};
document.getElementById('fsOpts').onclick=e=>{
  const b=e.target.closest('.opt');if(b)saveCfg({fs:b.dataset.fs});
};
document.getElementById('colorWheel').oninput=e=>{
  document.getElementById('colorHex').value=e.target.value.toUpperCase();
  saveCfg({solid:e.target.value});
};
document.getElementById('colorHex').onchange=e=>{
  let v=e.target.value.trim();
  if(!v.startsWith('#'))v='#'+v;
  if(/^#[0-9a-fA-F]{6}$/.test(v)){
    document.getElementById('colorWheel').value=v;
    saveCfg({solid:v});
  }else toast(t('toast.color'));
};
document.getElementById('settingsSave').onclick=()=>{
  localStorage.setItem('gdv_ai',JSON.stringify({
    base:document.getElementById('aiUrl').value.trim(),
    key:document.getElementById('aiKey').value.trim(),
    model:document.getElementById('aiModel').value.trim()}));
  document.getElementById('settingsModal').classList.remove('show');
  toast(t('toast.saved'));buildAISummary();
};

/* ================= 主题 ================= */
function applyTheme(t2){document.documentElement.dataset.theme=t2;localStorage.setItem('gdv_theme',t2)}
document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.dataset.theme;
  const isDark=cur==='dark'||(cur==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  applyTheme(isDark?'light':'dark');
};
if(localStorage.getItem('gdv_theme'))applyTheme(localStorage.getItem('gdv_theme'));
else if(matchMedia('(prefers-color-scheme: dark)').matches)applyTheme('dark');

/* ================= 交互 ================= */
document.getElementById('refreshBtn').onclick=()=>refresh(false);
document.querySelector('.toolbar').addEventListener('click',e=>{
  const chip=e.target.closest('.chip');if(!chip)return;
  if(chip.dataset.sort){
    SORT=chip.dataset.sort;
    document.querySelectorAll('.sort-chip').forEach(c=>c.classList.toggle('active',c.dataset.sort===SORT));
    page=1;render();return;
  }
  if(chip.dataset.src){
    const s=chip.dataset.src;
    selSrcs.has(s)?(selSrcs.delete(s),chip.classList.remove('active')):(selSrcs.add(s),chip.classList.add('active'));
  }else if(chip.dataset.cat){
    const c=chip.dataset.cat;
    selCats.has(c)?(selCats.delete(c),chip.classList.remove('active')):(selCats.add(c),chip.classList.add('active'));
  }
  page=1;render();
});
document.getElementById('resetBtn').onclick=()=>{
  selSrcs.clear();selCats.clear();FILTER_Q='';page=1;
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.chip:not(.sort-chip)').forEach(c=>c.classList.remove('active'));
  render();
};
document.getElementById('searchInput').oninput=e=>{FILTER_Q=e.target.value.trim();page=1;render()};

/* ================= 启动 ================= */
applyI18n();
buildChips();
loadSettings();
(function init(){
  try{
    const cache=JSON.parse(localStorage.getItem(CACHE_KEY));
    if(cache&&cache.items&&cache.items.length&&Date.now()-cache.time<24*36e5){
      ALL=cache.items;
      document.getElementById('lastUpdated').textContent=t('updated')+
        new Date(cache.time).toLocaleTimeString(LANG==='zh'?'zh-CN':'en-US',{hour:'2-digit',minute:'2-digit'});
      render();buildAISummary();route();
      toast(t('toast.cache'));
      refresh(true);return;
    }
  }catch(e){}
  refresh(false).then(route);
})();
</script>
