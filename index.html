<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameDev Pulse · 游戏开发资讯雷达</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ========== Material 3 Tokens ========== */
:root{
  --md-primary:#6750A4; --md-on-primary:#fff;
  --md-primary-container:#EADDFF; --md-on-pc:#21005D;
  --md-secondary-container:#E8DEF8; --md-tertiary-container:#FFD8E4;
  --md-surface:#F7F2FA; --md-surface-2:#EEE7F4;
  --md-on-surface:#1D1B20; --md-on-surface-var:#49454F;
  --md-outline:rgba(121,116,126,.28);
  --glass-bg:linear-gradient(135deg,rgba(255,255,255,.66),rgba(255,255,255,.38));
  --glass-border:rgba(255,255,255,.65);
  --glass-shadow:0 8px 32px rgba(80,60,140,.14), inset 0 1px 0 rgba(255,255,255,.7);
  --radius-l:28px; --radius-m:20px; --radius-s:14px;
  --blob1:#B39DDB; --blob2:#80DEEA; --blob3:#F48FB1; --blob4:#FFE082;
}
[data-theme="dark"]{
  --md-primary:#D0BCFF; --md-on-primary:#381E72;
  --md-primary-container:#4F378B; --md-on-pc:#EADDFF;
  --md-secondary-container:#4A4458; --md-tertiary-container:#633B48;
  --md-surface:#141218; --md-surface-2:#1D1B20;
  --md-on-surface:#E6E0E9; --md-on-surface-var:#CAC4D0;
  --md-outline:rgba(147,143,153,.30);
  --glass-bg:linear-gradient(135deg,rgba(40,36,52,.62),rgba(30,27,38,.44));
  --glass-border:rgba(255,255,255,.12);
  --glass-shadow:0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  --blob1:#4527A0; --blob2:#006064; --blob3:#880E4F; --blob4:#5D4037;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Manrope','Noto Sans SC',system-ui,sans-serif;background:var(--md-surface);
  color:var(--md-on-surface);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
/* Liquid Glass 背景 */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;filter:blur(70px) saturate(1.2)}
.blob{position:absolute;border-radius:50%;opacity:.55;animation:float 22s ease-in-out infinite}
.blob:nth-child(1){width:44vw;height:44vw;background:var(--blob1);top:-12%;left:-8%}
.blob:nth-child(2){width:36vw;height:36vw;background:var(--blob2);top:30%;right:-10%;animation-delay:-6s}
.blob:nth-child(3){width:32vw;height:32vw;background:var(--blob3);bottom:-10%;left:22%;animation-delay:-12s}
.blob:nth-child(4){width:24vw;height:24vw;background:var(--blob4);top:8%;left:48%;animation-delay:-17s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(5vw,-4vh) scale(1.12)}66%{transform:translate(-4vw,5vh) scale(.94)}}
.glass{background:var(--glass-bg);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
/* 顶栏 */
header{position:sticky;top:14px;z-index:50;margin:14px auto 0;max-width:1180px;display:flex;align-items:center;
  gap:14px;padding:12px 20px;border-radius:999px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.3px}
.logo .dot{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(135deg,var(--md-primary),#9C27B0);color:#fff;box-shadow:0 4px 14px rgba(103,80,164,.4)}
.logo small{display:block;font-size:11px;font-weight:600;color:var(--md-on-surface-var);letter-spacing:.4px}
header .spacer{flex:1}
#lastUpdated{font-size:12px;color:var(--md-on-surface-var);white-space:nowrap}
.icon-btn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:18px;display:grid;
  place-items:center;background:var(--md-secondary-container);color:var(--md-on-surface);transition:transform .2s,box-shadow .2s}
.icon-btn:hover{transform:scale(1.08);box-shadow:0 4px 16px rgba(0,0,0,.18)}
.fab{border:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;
  padding:0 22px;height:48px;border-radius:16px;color:var(--md-on-primary);
  background:linear-gradient(135deg,var(--md-primary),#8E6FD8);box-shadow:0 6px 20px rgba(103,80,164,.45);
  transition:transform .2s,box-shadow .2s;font-family:inherit}
.fab:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(103,80,164,.55)}
.fab .ic{display:inline-block;font-size:17px;transition:transform .3s}
.fab.loading .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
/* Hero */
.hero{border-radius:var(--radius-l);padding:24px 28px;margin-bottom:20px}
.hero h1{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.5px}
.hero h1 span{background:linear-gradient(90deg,var(--md-primary),#E91E63);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--md-primary-container);color:var(--md-on-pc)}
/* 筛选栏（按消息源分组） */
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.src-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.group-label{font-size:12px;font-weight:700;color:var(--md-on-surface-var);min-width:56px;flex:none}
.chip{border:1px solid var(--md-outline);background:transparent;color:var(--md-on-surface-var);
  padding:7px 15px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:7px;transition:all .2s}
.chip:hover{background:var(--md-surface-2)}
.chip.active{background:var(--md-secondary-container);color:var(--md-on-surface);border-color:transparent;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.src-dot{width:9px;height:9px;border-radius:50%;flex:none}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px}
.search input{border:none;outline:none;background:transparent;color:var(--md-on-surface);font-family:inherit;
  font-size:13.5px;width:170px}
/* ===== 横向宽卡片 ===== */
.grid{display:flex;flex-direction:column;gap:18px}
.card{border-radius:var(--radius-m);overflow:hidden;display:grid;grid-template-columns:280px 1fr;
  min-height:172px;cursor:pointer;transition:transform .28s cubic-bezier(.2,.8,.3,1.1),box-shadow .28s;
  animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 44px rgba(80,60,140,.22)}
.thumb{position:relative;overflow:hidden;background:var(--md-surface-2);min-height:172px}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:transform .5s}
.card:hover .thumb img{transform:scale(1.06)}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;
  background:linear-gradient(135deg,var(--md-primary-container),var(--md-tertiary-container))}
.cat-tag{position:absolute;right:12px;top:12px;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;
  background:var(--md-primary);color:#fff}
[data-theme="dark"] .cat-tag{color:#381E72}
.body{padding:18px 22px;display:flex;flex-direction:column;gap:9px;min-width:0}
.meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--md-on-surface-var);font-weight:600}
.meta .time{margin-left:auto;font-weight:500}
.card h3{font-size:18px;line-height:1.45;font-weight:700;letter-spacing:-.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--md-on-surface)}
.card:hover h3{color:var(--md-primary)}
.summary{font-size:13.5px;line-height:1.7;color:var(--md-on-surface-var);flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.link{font-size:13px;font-weight:700;color:var(--md-primary);text-decoration:none;padding:7px 16px;
  border-radius:999px;background:color-mix(in srgb,var(--md-primary) 12%,transparent);transition:all .2s}
.link:hover{background:var(--md-primary);color:#fff;box-shadow:0 4px 14px rgba(103,80,164,.4)}
/* ===== 阅读界面 ===== */
.reader-panel{border-radius:var(--radius-l);padding:30px 36px 40px;max-width:860px;margin:0 auto;
  animation:fadeUp .45s ease both}
.back-btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-family:inherit;
  font-weight:700;font-size:13.5px;color:var(--md-on-surface);background:var(--md-secondary-container);
  padding:9px 18px;border-radius:999px;margin-bottom:22px;transition:all .2s}
.back-btn:hover{background:var(--md-primary);color:#fff;transform:translateX(-3px)}
.r-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--md-on-surface-var)}
.r-meta .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;
  background:var(--md-secondary-container);color:var(--md-on-surface)}
#rTitle{font-size:clamp(24px,3.6vw,36px);line-height:1.3;font-weight:800;letter-spacing:-.6px;margin-bottom:12px}
/* 原文链接：标题正下方 */
.r-link{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--md-primary);font-weight:600;
  text-decoration:none;padding:10px 16px;border-radius:var(--radius-s);margin-bottom:22px;
  background:color-mix(in srgb,var(--md-primary) 10%,transparent);word-break:break-all;transition:all .2s}
.r-link:hover{background:color-mix(in srgb,var(--md-primary) 20%,transparent);transform:translateX(2px)}
.r-figure{margin:0 0 26px;border-radius:var(--radius-m);overflow:hidden;background:var(--md-surface-2)}
.r-figure img{width:100%;display:block;max-height:440px;object-fit:cover}
.r-figure .ph{height:240px;display:grid;place-items:center;font-size:64px;
  background:linear-gradient(135deg,var(--md-primary-container),var(--md-tertiary-container))}
#rBody{font-size:16px;line-height:1.9;color:var(--md-on-surface)}
#rBody p{margin-bottom:1.1em;color:var(--md-on-surface-var)}
.r-open{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:14px;font-weight:700;
  color:#fff;text-decoration:none;padding:13px 28px;border-radius:999px;
  background:linear-gradient(135deg,var(--md-primary),#8E6FD8);box-shadow:0 6px 20px rgba(103,80,164,.4);transition:all .2s}
.r-open:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(103,80,164,.55)}
/* 骨架屏 */
.skel{border-radius:var(--radius-m);overflow:hidden;display:grid;grid-template-columns:280px 1fr;min-height:172px}
.skel .s-img{background:linear-gradient(90deg,var(--md-surface-2) 25%,var(--md-surface) 50%,var(--md-surface-2) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
.skel .s-lines{padding:20px 24px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.skel .s-line{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--md-surface-2) 25%,var(--md-surface) 50%,var(--md-surface-2) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
.skel .s-line.w40{width:40%}.skel .s-line.w90{width:88%}.skel .s-line.w70{width:68%}
@keyframes shimmer{to{background-position:-200% 0}}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);padding:13px 24px;
  border-radius:999px;font-size:13.5px;font-weight:600;z-index:99;background:var(--md-on-surface);
  color:var(--md-surface);opacity:0;transition:all .35s cubic-bezier(.2,.8,.3,1.2);box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:60px 20px;color:var(--md-on-surface-var)}
.empty .big{font-size:52px;margin-bottom:14px}
footer{text-align:center;font-size:12px;color:var(--md-on-surface-var);padding:20px;opacity:.7}
@media(max-width:720px){
  header{flex-wrap:wrap;border-radius:var(--radius-l)}
  #lastUpdated{display:none}
  .card{grid-template-columns:1fr}
  .thumb{min-height:160px;aspect-ratio:16/9}
  .skel{grid-template-columns:1fr}
  .skel .s-img{height:150px}
  .search{margin-left:0;width:100%}
  .search input{width:100%}
  .reader-panel{padding:22px 20px 32px}
}
</style>
</head>
<body>
<div class="blobs"><div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>

<header class="glass">
  <div class="logo"><div class="dot">🎮</div><div>GameDev Pulse<small>游戏开发资讯雷达</small></div></div>
  <div class="spacer"></div>
  <span id="lastUpdated"></span>
  <button class="icon-btn" id="themeBtn" title="切换主题">🌓</button>
  <button class="fab" id="refreshBtn"><span class="ic">⟳</span>刷新资讯</button>
</header>

<main>
  <!-- 列表视图 -->
  <div id="listView">
    <section class="hero glass">
      <h1>今日 <span>Game Dev</span> 行业动态</h1>
      <div class="stats" id="stats"><span class="stat">⏳ 正在为你聚合资讯…</span></div>
    </section>

    <div class="toolbar glass" style="border-radius:var(--radius-m);padding:16px 18px">
      <div class="src-row" id="rowAll">
        <span class="group-label">筛选</span>
        <button class="chip active" data-src="全部">全部</button>
        <div class="search glass">🔍<input id="searchInput" placeholder="搜索标题 / 关键词…"></div>
      </div>
      <div class="src-row" id="rowOverseas"><span class="group-label">🌍 海外源</span></div>
      <div class="src-row" id="rowCN"><span class="group-label">🇨🇳 国内源</span></div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <!-- 阅读视图 -->
  <section id="readerView" class="reader-panel glass" hidden>
    <button class="back-btn" id="backBtn">← 返回列表</button>
    <div class="r-meta" id="rMeta"></div>
    <h1 id="rTitle"></h1>
    <a class="r-link" id="rLink" target="_blank" rel="noopener"></a>
    <figure class="r-figure" id="rFigure"></figure>
    <div id="rBody"></div>
    <a class="r-open" id="rOpen" target="_blank" rel="noopener">打开原文 ↗</a>
  </section>
</main>

<footer>数据来自各媒体公开 RSS · Liquid Glass × Material 3</footer>
<div id="toast"></div>

<script>
/* ================= 配置：RSS 源（海外 + 国内） ================= */
const SOURCES = [
  { name:'Game Developer',     url:'https://www.gamedeveloper.com/rss.xml',              color:'#E91E63', region:'overseas' },
  { name:'Rock Paper Shotgun', url:'https://www.rockpapershotgun.com/feed',              color:'#FF7043', region:'overseas' },
  { name:'PC Gamer',           url:'https://www.pcgamer.com/rss/',                       color:'#42A5F5', region:'overseas' },
  { name:'Eurogamer',          url:'https://www.eurogamer.net/?format=rss',              color:'#FFCA28', region:'overseas' },
  { name:'Destructoid',        url:'https://www.destructoid.com/feed/',                  color:'#26A69A', region:'overseas' },
  { name:'80 Level',           url:'https://80.lv/feed/',                                color:'#7E57C2', region:'overseas' },
  { name:'Reddit · r/gamedev', url:'https://www.reddit.com/r/gamedev/hot/.rss?limit=25', color:'#FF5722', region:'overseas' },
  { name:'itch.io Devlogs',    url:'https://itch.io/devlogs.xml',                        color:'#EC4899', region:'overseas' },
  { name:'indienova',          url:'https://indienova.com/feeds/all.xml',                color:'#F43F5E', region:'cn' },
  { name:'GameLook',           url:'http://www.gamelook.com.cn/feed',                    color:'#3B82F6', region:'cn' },
  { name:'游戏陀螺',           url:'https://www.youxituoluo.com/feed',                   color:'#10B981', region:'cn' },
  { name:'GameRes 游资网',     url:'https://www.gameres.com/rss.xml',                    color:'#F59E0B', region:'cn' },
  { name:'触乐',               url:'http://www.chuapp.com/feed',                         color:'#8B5CF6', region:'cn' },
];

const PROXIES = [
  u => '/proxy?url=' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
];

const CAT_RULES = [
  ['AI', /\b(ai|artificial intelligence|machine learning|llm|generative|neural|gpt|diffusion)\b|生成式|人工智能/i],
  ['引擎 & 技术', /\b(unity|unreal|godot|engine|shader|render(ing)?|graphics|gpu|ray tracing|sdk|physics)\b|引擎|技术|渲染/i],
  ['行业动态', /\b(layoff|acquisition|funding|invest|earnings|revenue|union|lawsuit)\b|裁员|收购|融资|财报|行业|产业|市场/i],
  ['平台 & 发行', /\b(steam|epic games store|playstation|xbox|nintendo|switch|console|game pass|mobile|ios|android)\b|主机|平台|发行|手游/i],
  ['新作 & 发售', /\b(release|launch|announc|trailer|demo|early access|dlc|patch|sequel|reveal)\b|发售|公布|预告|新游|上线/i],
  ['独立开发', /\b(indie|devlog|game ?jam|pixel art|solo dev|kickstarter)\b|独立|独游|开发日志/i],
];
const SRC_MAP = Object.fromEntries(SOURCES.map(s => [s.name, s]));
const CACHE_KEY = 'gamedev_pulse_v2';
const MAX_AGE_DAYS = 30, PER_SOURCE = 12;
let ALL = [], FILTER = { src:'全部', q:'' };

/* ================= 网络 ================= */
async function fetchWithTimeout(url, ms){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, { signal:c.signal }); } finally { clearTimeout(t); }
}
async function fetchText(rawUrl){
  let lastErr;
  for (const wrap of PROXIES){
    try {
      const r = await fetchWithTimeout(wrap(rawUrl), 12000);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const txt = await r.text();
      if (txt && txt.trim().startsWith('<')) return txt;
      throw new Error('not xml');
    } catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('all proxies failed');
}

/* ================= 解析 ================= */
function decodeEntities(s){ const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }
function firstText(node, names){
  for (const n of names){
    const el = node.getElementsByTagName(n)[0];
    if (el && el.textContent.trim()) return el;
  }
  return null;
}
function extractImage(node, contentHtml){
  const mc = node.getElementsByTagName('media:content')[0] || node.querySelector('content[url]');
  if (mc?.getAttribute('url')) return mc.getAttribute('url');
  const mt = node.getElementsByTagName('media:thumbnail')[0];
  if (mt?.getAttribute('url')) return mt.getAttribute('url');
  for (const e of node.getElementsByTagName('enclosure')){
    const u = e.getAttribute('url'), t = e.getAttribute('type') || '';
    if (u && (t.startsWith('image') || /\.(jpe?g|png|webp|gif)(\?|$)/i.test(u))) return u;
  }
  if (contentHtml){ const m = contentHtml.match(/<img[^>]+src=["']([^"']+)["']/i); if (m) return m[1]; }
  return '';
}
function parseFeed(xml, src){
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  if (doc.querySelector('parsererror')) throw new Error('XML parse error');
  let nodes = [...doc.getElementsByTagName('item')];
  if (!nodes.length) nodes = [...doc.getElementsByTagName('entry')];
  const out = [];
  for (const node of nodes.slice(0, PER_SOURCE)){
    const titleEl = firstText(node, ['title']);
    const linkEl = node.querySelector('link:not([rel])') || node.getElementsByTagName('link')[0];
    const link = linkEl ? (linkEl.getAttribute('href') || linkEl.textContent).trim() : '';
    const dateEl = firstText(node, ['pubDate','published','updated','dc:date']);
    const descEl = firstText(node, ['content:encoded','description','summary','content']);
    const content = descEl ? descEl.textContent : '';
    const title = decodeEntities((titleEl?.textContent || '').trim());
    if (!title || !link) continue;
    const date = dateEl ? new Date(dateEl.textContent.trim()) : new Date();
    const text = (title + ' ' + content).toLowerCase();
    const cat = (CAT_RULES.find(([ , re]) => re.test(text)) || ['综合'])[0];
    out.push({
      id: 'a' + hashCode(link),
      title, link, cat,
      content,
      summary: decodeEntities(content).replace(/\s+/g,' ').trim().slice(0, 200),
      image: extractImage(node, content),
      date: isNaN(date) ? Date.now() : date.getTime(),
      source: src.name,
    });
  }
  return out;
}
function hashCode(s){ let h = 0; for (let i = 0; i < s.length; i++){ h = ((h << 5) - h + s.charCodeAt(i)) | 0; } return Math.abs(h); }

/* ================= 聚合 ================= */
async function refresh(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading'); btn.disabled = true;
  showSkeleton();
  const results = await Promise.allSettled(SOURCES.map(s => fetchText(s.url).then(x => parseFeed(x, s))));
  let ok = 0, failCount = 0;
  const items = [];
  results.forEach(r => {
    if (r.status === 'fulfilled' && r.value.length){ ok++; items.push(...r.value); } else failCount++;
  });
  const seen = new Set(), now = Date.now();
  ALL = items
    .filter(it => { const k = it.link.split(/[?#]/)[0]; if (seen.has(k)) return false; seen.add(k);
      return now - it.date < MAX_AGE_DAYS * 864e5; })
    .sort((a,b) => b.date - a.date).slice(0, 150);
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ time: now, items: ALL })); } catch(e){}
  document.getElementById('lastUpdated').textContent =
    '更新于 ' + new Date(now).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  renderHero(); render();
  btn.classList.remove('loading'); btn.disabled = false;
  if (ALL.length) toast(`✅ 已聚合 ${ALL.length} 条资讯（${ok} 个源成功${failCount ? '，' + failCount + ' 个失败' : ''}）`);
  else toast('⚠️ 所有源均获取失败，请检查网络或确认 server.py 已运行');
}

/* ================= 渲染：筛选栏（按消息源） ================= */
function buildChips(){
  const rowO = document.getElementById('rowOverseas');
  const rowC = document.getElementById('rowCN');
  SOURCES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.src = s.name;
    b.innerHTML = `<span class="src-dot" style="background:${s.color}"></span>${s.name}`;
    (s.region === 'cn' ? rowC : rowO).appendChild(b);
  });
}
function relTime(ts){
  const d = Date.now() - ts;
  if (d < 36e5) return Math.max(1, Math.round(d/6e4)) + ' 分钟前';
  if (d < 864e5) return Math.round(d/36e5) + ' 小时前';
  return Math.round(d/864e5) + ' 天前';
}
function renderHero(){
  const stats = document.getElementById('stats');
  const srcCount = new Set(ALL.map(i => i.source)).size;
  const cnCount = ALL.filter(i => SRC_MAP[i.source]?.region === 'cn').length;
  const today = ALL.filter(i => Date.now() - i.date < 864e5).length;
  stats.innerHTML = '';
  [`📰 共 ${ALL.length} 条`, `今日新增 ${today} 条`, `📡 ${srcCount} 个信源`, `🇨🇳 国内 ${cnCount} 条`]
    .forEach(t => { const s = document.createElement('span'); s.className='stat'; s.textContent=t; stats.appendChild(s); });
}
/* 横向宽卡片 */
function makeCard(it, idx){
  const card = document.createElement('article');
  card.className = 'card glass';
  card.style.animationDelay = Math.min(idx * 40, 400) + 'ms';
  card.onclick = () => { location.hash = '#read/' + it.id; };
  // 左图
  const thumb = document.createElement('div'); thumb.className = 'thumb';
  const ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = '🎮';
  thumb.appendChild(ph);
  if (it.image){
    const img = new Image(); img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.alt = it.title;
    img.src = it.image; img.onload = () => ph.remove(); img.onerror = () => img.remove();
    thumb.appendChild(img);
  }
  const tag = document.createElement('span'); tag.className = 'cat-tag'; tag.textContent = it.cat;
  thumb.appendChild(tag);
  // 右文
  const body = document.createElement('div'); body.className = 'body';
  const sc = SRC_MAP[it.source]?.color || '#888';
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.innerHTML = `<span class="src-dot" style="background:${sc}"></span><span>${it.source}</span>
    <span class="time">${relTime(it.date)}</span>`;
  const h3 = document.createElement('h3'); h3.textContent = it.title;
  const p = document.createElement('p'); p.className = 'summary';
  p.textContent = it.summary || '（无摘要，点击查看详情）';
  const foot = document.createElement('div'); foot.className = 'foot';
  foot.innerHTML = `<span class="link">阅读全文 →</span>`;
  body.append(meta, h3, p, foot);
  card.append(thumb, body);
  return card;
}
function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const q = FILTER.q.toLowerCase();
  const list = ALL.filter(it =>
    (FILTER.src === '全部' || it.source === FILTER.src) &&
    (!q || (it.title + it.summary + it.source).toLowerCase().includes(q)));
  if (!list.length){
    grid.innerHTML = `<div class="empty"><div class="big">🕹️</div><p>暂无匹配的资讯，换个消息源或关键词试试～</p></div>`;
    return;
  }
  list.forEach((it, i) => grid.appendChild(makeCard(it, i)));
}
function showSkeleton(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < 5; i++){
    const s = document.createElement('div'); s.className = 'skel glass';
    s.innerHTML = `<div class="s-img"></div><div class="s-lines">
      <div class="s-line w40"></div><div class="s-line w90"></div><div class="s-line w70"></div></div>`;
    grid.appendChild(s);
  }
}

/* ================= 阅读界面 ================= */
function articleParagraphs(html){
  if (!html) return [];
  let t = html
    .replace(/<(script|style)[\s\S]*?<\/\1>/gi, '')
    .replace(/<(br|\/p|\/div|\/h[1-6]|\/li|\/blockquote)[^>]*>/gi, '\n')
    .replace(/<[^>]+>/g, ' ');
  t = decodeEntities(t);
  return t.split(/\n+/).map(s => s.replace(/\s+/g,' ').trim()).filter(s => s.length > 1).slice(0, 40);
}
function openReader(id){
  const it = ALL.find(a => a.id === id);
  if (!it){ location.hash = ''; return; }
  const sc = SRC_MAP[it.source]?.color || '#888';
  document.getElementById('rMeta').innerHTML =
    `<span class="pill"><span class="src-dot" style="background:${sc}"></span>${it.source}</span>
     <span class="pill">🏷 ${it.cat}</span><span class="pill">🕐 ${relTime(it.date)}</span>`;
  document.getElementById('rTitle').textContent = it.title;
  const rLink = document.getElementById('rLink');
  rLink.href = it.link;
  let host = it.link; try { host = new URL(it.link).hostname; } catch(e){}
  rLink.innerHTML = `🔗 原文链接：<span style="text-decoration:underline">${host}</span>&nbsp;·&nbsp;${it.link}`;
  const fig = document.getElementById('rFigure'); fig.innerHTML = '';
  if (it.image){
    const img = new Image(); img.referrerPolicy = 'no-referrer'; img.alt = it.title; img.src = it.image;
    img.onerror = () => { fig.innerHTML = '<div class="ph">🎮</div>'; };
    fig.appendChild(img);
  } else fig.innerHTML = '<div class="ph">🎮</div>';
  const rBody = document.getElementById('rBody'); rBody.innerHTML = '';
  const paras = articleParagraphs(it.content);
  if (paras.length){ paras.forEach(tx => { const p = document.createElement('p'); p.textContent = tx; rBody.appendChild(p); }); }
  else { const p = document.createElement('p'); p.textContent = '该来源未提供正文内容，请通过上方原文链接查看完整报道。'; rBody.appendChild(p); }
  document.getElementById('rOpen').href = it.link;
  document.getElementById('listView').hidden = true;
  document.getElementById('readerView').hidden = false;
  window.scrollTo({ top: 0 });
}
function closeReader(){
  document.getElementById('readerView').hidden = true;
  document.getElementById('listView').hidden = false;
}
function route(){
  const h = location.hash;
  if (h.startsWith('#read/')) openReader(h.slice(6));
  else closeReader();
}
window.addEventListener('hashchange', route);
document.getElementById('backBtn').onclick = () => { location.hash = ''; };

/* ================= 交互 ================= */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}
document.getElementById('refreshBtn').onclick = refresh;
document.querySelector('.toolbar').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  FILTER.src = chip.dataset.src; render();
});
document.getElementById('searchInput').oninput = e => { FILTER.q = e.target.value.trim(); render(); };
const themeBtn = document.getElementById('themeBtn');
function applyTheme(t){ document.documentElement.dataset.theme = t; localStorage.setItem('gdv_theme', t); }
themeBtn.onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const isDark = cur === 'dark' || (cur === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  applyTheme(isDark ? 'light' : 'dark');
};
if (localStorage.getItem('gdv_theme')) applyTheme(localStorage.getItem('gdv_theme'));
else if (matchMedia('(prefers-color-scheme: dark)').matches) applyTheme('dark');

/* ================= 启动 ================= */
buildChips();
(function init(){
  try {
    const cache = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (cache?.items?.length && Date.now() - cache.time < 10 * 6e4){
      ALL = cache.items;
      document.getElementById('lastUpdated').textContent =
        '更新于 ' + new Date(cache.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
      renderHero(); render(); route();
      toast('📦 已加载缓存，点击「刷新资讯」获取最新');
      return;
    }
  } catch(e){}
  refresh().then(route);
})();
</script>
