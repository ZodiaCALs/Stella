<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto" data-bg="flow" data-font="sans" data-fs="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameDev Pulse · 游戏开发资讯雷达</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{
  --md-primary:#6750A4;--md-on-primary:#fff;--md-primary-container:#EADDFF;--md-on-pc:#21005D;
  --md-secondary-container:#E8DEF8;--md-tertiary-container:#FFD8E4;
  --md-surface:#F7F2FA;--md-surface-2:#EEE7F4;--md-on-surface:#1D1B20;--md-on-surface-var:#49454F;
  --md-outline:rgba(121,116,126,.28);
  --glass-bg:linear-gradient(135deg,rgba(255,255,255,.66),rgba(255,255,255,.38));
  --glass-border:rgba(255,255,255,.65);
  --glass-shadow:0 8px 32px rgba(80,60,140,.14),inset 0 1px 0 rgba(255,255,255,.7);
  --radius-l:28px;--radius-m:20px;--radius-s:14px;
  --blob1:#B39DDB;--blob2:#80DEEA;--blob3:#F48FB1;--blob4:#FFE082;
  --fz:1;
  --t-xs:calc(11.5px*var(--fz));--t-sm:calc(13px*var(--fz));--t-md:calc(14.5px*var(--fz));
  --t-lg:calc(16px*var(--fz));--t-xl:calc(18.5px*var(--fz));
  --ff-body:'Manrope','Noto Sans SC',system-ui,sans-serif;
}
html[data-fs="sm"]{--fz:.86} html[data-fs="lg"]{--fz:1.18}
html[data-font="serif"]{--ff-body:Georgia,'Noto Serif SC','Songti SC',serif}
html[data-font="mono"]{--ff-body:ui-monospace,Consolas,'Noto Sans Mono CJK SC',monospace}
[data-theme="dark"]{
  --md-primary:#D0BCFF;--md-on-primary:#381E72;--md-primary-container:#4F378B;--md-on-pc:#EADDFF;
  --md-secondary-container:#4A4458;--md-tertiary-container:#633B48;
  --md-surface:#141218;--md-surface-2:#1D1B20;--md-on-surface:#E6E0E9;--md-on-surface-var:#CAC4D0;
  --md-outline:rgba(147,143,153,.3);
  --glass-bg:linear-gradient(135deg,rgba(40,36,52,.62),rgba(30,27,38,.44));
  --glass-border:rgba(255,255,255,.12);
  --glass-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
  --blob1:#4527A0;--blob2:#006064;--blob3:#880E4F;--blob4:#5D4037;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--ff-body);background:var(--md-surface);color:var(--md-on-surface);
  min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
/* 背景层 */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;filter:blur(70px) saturate(1.2)}
.blob{position:absolute;border-radius:50%;opacity:.55;animation:float 22s ease-in-out infinite}
.blob:nth-child(1){width:44vw;height:44vw;background:var(--blob1);top:-12%;left:-8%}
.blob:nth-child(2){width:36vw;height:36vw;background:var(--blob2);top:30%;right:-10%;animation-delay:-6s}
.blob:nth-child(3){width:32vw;height:32vw;background:var(--blob3);bottom:-10%;left:22%;animation-delay:-12s}
.blob:nth-child(4){width:24vw;height:24vw;background:var(--blob4);top:8%;left:48%;animation-delay:-17s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(5vw,-4vh) scale(1.12)}66%{transform:translate(-4vw,5vh) scale(.94)}}
html[data-bg="solid"] .blobs{background:var(--solid,#0F172A);filter:none}
html[data-bg="solid"] .blob{display:none}
html[data-bg="pure"] .blob{display:none}
html[data-bg="pure"] .blobs{filter:none;background:
  radial-gradient(1200px 600px at 15% 0%,rgba(160,160,190,.18),transparent 60%),
  radial-gradient(1000px 600px at 90% 100%,rgba(140,150,170,.16),transparent 60%),
  linear-gradient(180deg,var(--md-surface),var(--md-surface-2))}
html[data-bg="pure"] .glass{-webkit-backdrop-filter:blur(34px) saturate(1.4);backdrop-filter:blur(34px) saturate(1.4)}
.glass{background:var(--glass-bg);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
/* 顶栏 */
header{position:sticky;top:14px;z-index:50;margin:14px auto 0;max-width:1180px;display:flex;align-items:center;
  gap:12px;padding:12px 20px;border-radius:999px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:var(--t-xl)}
.logo .dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(135deg,var(--md-primary),#9C27B0);color:#fff}
.logo small{display:block;font-size:var(--t-xs);font-weight:600;color:var(--md-on-surface-var)}
header .spacer{flex:1}
#lastUpdated{font-size:var(--t-xs);color:var(--md-on-surface-var);white-space:nowrap}
.icon-btn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:18px;display:grid;
  place-items:center;background:var(--md-secondary-container);color:var(--md-on-surface);transition:.2s}
.icon-btn:hover{transform:scale(1.08)}
.fab{border:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700;font-size:var(--t-md);
  padding:0 22px;height:48px;border-radius:16px;color:var(--md-on-primary);font-family:inherit;
  background:linear-gradient(135deg,var(--md-primary),#8E6FD8);transition:.2s}
.fab:hover{transform:translateY(-2px)}
.fab .ic{display:inline-block}
.fab.loading .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
/* AI 情报速览 */
.hero{border-radius:var(--radius-l);padding:26px 28px;margin-bottom:20px}
.hero-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero-top h1{font-size:calc(clamp(22px,3vw,30px)*var(--fz));font-weight:800;display:flex;align-items:center;gap:10px}
.ai-badge{font-size:var(--t-xs);font-weight:700;padding:5px 12px;border-radius:999px;
  background:var(--md-primary-container);color:var(--md-on-pc)}
.hero .spacer{flex:1}
.ai-summary{font-size:var(--t-md);line-height:1.75;color:var(--md-on-surface-var);margin:12px 0 18px}
.digest{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.bucket{border-radius:var(--radius-m);padding:16px;background:var(--md-secondary-container);border:1px solid var(--md-outline)}
.bucket h4{font-size:var(--t-md);font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.bucket .cnt{margin-left:auto;font-size:var(--t-xs);color:var(--md-on-surface-var)}
.bucket ul{list-style:none}
.bucket li{font-size:var(--t-sm);line-height:1.5;margin-bottom:9px}
.bucket a{color:var(--md-on-surface);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bucket a:hover{color:var(--md-primary)}
.bucket .bsrc{display:block;font-size:var(--t-xs);color:var(--md-on-surface-var);margin-top:2px}
.digest-empty{font-size:var(--t-sm);color:var(--md-on-surface-var)}
/* 多选筛选栏 */
.toolbar{display:flex;flex-direction:column;gap:12px;border-radius:var(--radius-m);padding:16px 18px;margin-bottom:22px}
.src-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.group-label{font-size:var(--t-xs);font-weight:700;color:var(--md-on-surface-var);min-width:62px;flex:none}
.chip{border:1px solid var(--md-outline);background:transparent;color:var(--md-on-surface-var);
  padding:7px 14px;border-radius:12px;font-size:var(--t-sm);font-weight:600;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:7px;transition:.18s;user-select:none}
.chip:hover{background:var(--md-surface-2)}
.chip.active{background:var(--md-primary);color:#fff;border-color:transparent}
[data-theme="dark"] .chip.active{color:#381E72}
.src-dot{width:9px;height:9px;border-radius:50%;flex:none}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px}
.search input{border:none;outline:none;background:transparent;color:var(--md-on-surface);font-family:inherit;font-size:var(--t-sm);width:160px}
.reset-btn{border:none;background:var(--md-tertiary-container);color:var(--md-on-surface);font-family:inherit;
  font-weight:700;font-size:var(--t-sm);padding:8px 16px;border-radius:999px;cursor:pointer}
/* 横向宽卡片 */
.grid{display:flex;flex-direction:column;gap:18px}
.card{border-radius:var(--radius-m);overflow:hidden;display:grid;grid-template-columns:280px 1fr;min-height:172px;
  cursor:pointer;transition:transform .28s,box-shadow .28s;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 44px rgba(80,60,140,.22)}
.thumb{position:relative;overflow:hidden;background:var(--md-surface-2);min-height:172px}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:transform .5s}
.card:hover .thumb img{transform:scale(1.06)}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;
  background:linear-gradient(135deg,var(--md-primary-container),var(--md-tertiary-container))}
.cat-tag{position:absolute;right:12px;top:12px;padding:5px 12px;border-radius:999px;font-size:var(--t-xs);
  font-weight:700;background:var(--md-primary);color:#fff}
[data-theme="dark"] .cat-tag{color:#381E72}
.body{padding:18px 22px;display:flex;flex-direction:column;gap:9px;min-width:0}
.meta{display:flex;align-items:center;gap:8px;font-size:var(--t-xs);color:var(--md-on-surface-var);font-weight:600}
.meta .time{margin-left:auto}
.card h3{font-size:var(--t-xl);line-height:1.45;font-weight:700;color:var(--md-on-surface);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card:hover h3{color:var(--md-primary)}
.summary{font-size:var(--t-md);line-height:1.7;color:var(--md-on-surface-var);flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;align-items:center;justify-content:space-between}
.link{font-size:var(--t-sm);font-weight:700;color:var(--md-primary);padding:7px 16px;border-radius:999px;
  background:color-mix(in srgb,var(--md-primary) 12%,transparent)}
/* 阅读界面 */
.reader-panel{border-radius:var(--radius-l);padding:30px 36px 40px;max-width:860px;margin:0 auto;animation:fadeUp .45s ease both}
.back-btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-family:inherit;
  font-weight:700;font-size:var(--t-sm);color:var(--md-on-surface);background:var(--md-secondary-container);
  padding:9px 18px;border-radius:999px;margin-bottom:22px;transition:.2s}
.back-btn:hover{background:var(--md-primary);color:#fff}
.r-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:var(--t-sm);font-weight:600;color:var(--md-on-surface-var)}
.r-meta .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;background:var(--md-secondary-container);color:var(--md-on-surface)}
#rTitle{font-size:calc(clamp(24px,3.6vw,36px)*var(--fz));line-height:1.3;font-weight:800;margin-bottom:12px}
.r-link{display:flex;gap:8px;font-size:var(--t-sm);color:var(--md-primary);font-weight:600;text-decoration:none;
  padding:10px 16px;border-radius:var(--radius-s);margin-bottom:22px;word-break:break-all;
  background:color-mix(in srgb,var(--md-primary) 10%,transparent)}
.r-figure{margin:0 0 26px;border-radius:var(--radius-m);overflow:hidden;background:var(--md-surface-2)}
.r-figure img{width:100%;display:block;max-height:440px;object-fit:cover}
.r-figure .ph{height:240px;display:grid;place-items:center;font-size:64px;
  background:linear-gradient(135deg,var(--md-primary-container),var(--md-tertiary-container))}
#rBody{font-size:var(--t-lg);line-height:1.9}
#rBody p{margin-bottom:1.1em;color:var(--md-on-surface-var)}
.r-open{display:inline-flex;gap:8px;margin-top:18px;font-size:var(--t-md);font-weight:700;color:#fff;text-decoration:none;
  padding:13px 28px;border-radius:999px;background:linear-gradient(135deg,var(--md-primary),#8E6FD8)}
/* 翻页 */
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:26px;flex-wrap:wrap}
.page-info{font-size:var(--t-sm);color:var(--md-on-surface-var);margin-right:8px}
.pg-btn{min-width:40px;height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--md-outline);
  background:transparent;color:var(--md-on-surface-var);font-family:inherit;font-weight:700;font-size:var(--t-sm);cursor:pointer;transition:.18s}
.pg-btn:hover:not(:disabled){background:var(--md-surface-2);color:var(--md-on-surface)}
.pg-btn.cur{background:var(--md-primary);color:#fff;border-color:transparent}
[data-theme="dark"] .pg-btn.cur{color:#381E72}
.pg-btn:disabled{opacity:.35;cursor:not-allowed}
/* 设置弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(15,12,24,.45);z-index:98;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:var(--radius-l);padding:26px 28px;animation:fadeUp .3s ease both}
.modal h2{font-size:var(--t-xl);margin-bottom:4px}
.modal .sub{font-size:var(--t-xs);color:var(--md-on-surface-var);margin-bottom:18px}
.opt-group{margin-bottom:20px}
.opt-group>label{display:block;font-size:var(--t-sm);font-weight:700;color:var(--md-on-surface-var);margin-bottom:10px}
.opt-row{display:flex;gap:9px;flex-wrap:wrap}
.opt{border:1px solid var(--md-outline);background:transparent;color:var(--md-on-surface);font-family:inherit;
  padding:9px 15px;border-radius:12px;font-size:var(--t-sm);font-weight:600;cursor:pointer;transition:.18s}
.opt:hover{background:var(--md-surface-2)}
.opt.active{background:var(--md-primary);color:#fff;border-color:transparent}
[data-theme="dark"] .opt.active{color:#381E72}
.swatches{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s}
.swatch:hover{transform:scale(1.12)}
.swatch.active{border-color:var(--md-on-surface)}
.field{margin-bottom:12px}
.field span{display:block;font-size:var(--t-xs);color:var(--md-on-surface-var);margin-bottom:6px}
.field input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--md-outline);background:var(--md-surface-2);
  color:var(--md-on-surface);font-family:inherit;font-size:var(--t-sm);outline:none}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.btn{border:none;font-family:inherit;font-weight:700;font-size:var(--t-sm);padding:11px 22px;border-radius:999px;cursor:pointer}
.btn.primary{background:var(--md-primary);color:#fff}
.btn.ghost{background:var(--md-secondary-container);color:var(--md-on-surface)}
/* 骨架屏/Toast/空态 */
.skel{border-radius:var(--radius-m);overflow:hidden;display:grid;grid-template-columns:280px 1fr;min-height:172px}
.skel .s-img,.skel .s-line{background:linear-gradient(90deg,var(--md-surface-2) 25%,var(--md-surface) 50%,var(--md-surface-2) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
.skel .s-lines{padding:20px 24px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.skel .s-line{height:14px;border-radius:7px}
.skel .s-line.w40{width:40%}.skel .s-line.w90{width:88%}.skel .s-line.w70{width:68%}
@keyframes shimmer{to{background-position:-200% 0}}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);padding:13px 24px;border-radius:999px;
  font-size:var(--t-sm);font-weight:600;z-index:99;background:var(--md-on-surface);color:var(--md-surface);opacity:0;
  transition:.35s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:60px 20px;color:var(--md-on-surface-var)}
.empty .big{font-size:52px;margin-bottom:14px}
footer{text-align:center;font-size:var(--t-xs);color:var(--md-on-surface-var);padding:20px;opacity:.7}
@media(max-width:720px){
  header{flex-wrap:wrap;border-radius:var(--radius-l)}
  #lastUpdated{display:none}
  .card,.skel{grid-template-columns:1fr}
  .thumb{min-height:160px;aspect-ratio:16/9}
  .skel .s-img{height:150px}
  .search{margin-left:0;width:100%}
  .search input{width:100%}
  .reader-panel{padding:22px 20px 32px}
}
</style>
</head>
<body>
<div class="blobs"><div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>

<header class="glass">
  <div class="logo"><div class="dot">🎮</div><div>GameDev Pulse<small>游戏开发资讯雷达</small></div></div>
  <div class="spacer"></div>
  <span id="lastUpdated"></span>
  <button class="icon-btn" id="themeBtn" title="明暗主题">🌓</button>
  <button class="icon-btn" id="settingsBtn" title="外观与 AI 设置">🎨</button>
  <button class="fab" id="refreshBtn"><span class="ic">⟳</span>刷新</button>
</header>

<main>
  <div id="listView">
    <!-- AI 情报速览 -->
    <section class="hero glass">
      <div class="hero-top">
        <h1>✨ AI 情报速览</h1>
        <span class="ai-badge" id="aiBadge">🧠 本地智能摘要</span>
        <div class="spacer"></div>
      </div>
      <p class="ai-summary" id="aiSummary">正在为你梳理近期重大动态……</p>
      <div class="digest" id="digest"></div>
    </section>

    <!-- 多选筛选栏 -->
    <div class="toolbar glass">
      <div class="src-row" id="rowOverseas"><span class="group-label">🌍 海外源</span></div>
      <div class="src-row" id="rowCN"><span class="group-label">🇨🇳 国内源</span></div>
      <div class="src-row" id="rowCat"><span class="group-label">🏷 分类</span>
        <div class="search glass">🔍<input id="searchInput" placeholder="搜索标题 / 关键词…"></div>
        <button class="reset-btn" id="resetBtn">↺ 重置筛选</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <!-- 阅读视图 -->
  <section id="readerView" class="reader-panel glass" hidden>
    <button class="back-btn" id="backBtn">← 返回列表</button>
    <div class="r-meta" id="rMeta"></div>
    <h1 id="rTitle"></h1>
    <a class="r-link" id="rLink" target="_blank" rel="noopener"></a>
    <figure class="r-figure" id="rFigure"></figure>
    <div id="rBody"></div>
    <a class="r-open" id="rOpen" target="_blank" rel="noopener">打开原文 ↗</a>
  </section>
</main>

<!-- 设置弹窗 -->
<div class="modal-mask" id="settingsModal">
  <div class="modal glass">
    <h2>🎨 外观与 AI 设置</h2>
    <p class="sub">所有设置自动保存到本地</p>
    <div class="opt-group">
      <label>背景风格</label>
      <div class="opt-row" id="bgOpts">
        <button class="opt" data-bg="flow">🌈 动态流光</button>
        <button class="opt" data-bg="solid">🎯 纯色背景</button>
        <button class="opt" data-bg="pure">🧊 纯液态玻璃</button>
      </div>
      <div class="swatches" id="swatches" style="display:none"></div>
    </div>
    <div class="opt-group">
      <label>字体</label>
      <div class="opt-row" id="fontOpts">
        <button class="opt" data-font="sans">现代无衬线</button>
        <button class="opt" data-font="serif">衬线文艺</button>
        <button class="opt" data-font="mono">等宽极客</button>
      </div>
    </div>
    <div class="opt-group">
      <label>字号</label>
      <div class="opt-row" id="fsOpts">
        <button class="opt" data-fs="sm">小</button>
        <button class="opt" data-fs="md">标准</button>
        <button class="opt" data-fs="lg">大</button>
      </div>
    </div>
    <div class="opt-group">
      <label>🤖 AI 摘要（可选，接真实大模型，留空则用本地智能摘要）</label>
      <div class="field"><span>API Base URL（OpenAI 兼容）</span>
        <input id="aiUrl" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1"></div>

<script>
/* ================= 源配置（多候选并发竞速） ================= */
const gn=(q,cn)=>cn
  ?'https://news.google.com/rss/search?q='+encodeURIComponent(q+' when:14d')+'&hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
  :'https://news.google.com/rss/search?q='+encodeURIComponent(q+' when:14d')+'&hl=en-US&gl=US&ceid=US:en';
const SOURCES=[
 {name:'Game Developer',color:'#E91E63',region:'overseas',urls:['https://www.gamedeveloper.com/rss.xml',gn('site:gamedeveloper.com')]},
 {name:'Rock Paper Shotgun',color:'#FF7043',region:'overseas',urls:['https://www.rockpapershotgun.com/feed',gn('site:rockpapershotgun.com')]},
 {name:'PC Gamer',color:'#42A5F5',region:'overseas',urls:['https://www.pcgamer.com/rss/','https://www.pcgamer.com/rss.xml',gn('site:pcgamer.com')]},
 {name:'Eurogamer',color:'#FFCA28',region:'overseas',urls:['https://www.eurogamer.net/?format=rss',gn('site:eurogamer.net')]},
 {name:'80 Level',color:'#7E57C2',region:'overseas',urls:['https://80.lv/feed',gn('site:80.lv')]},
 {name:'Reddit · r/gamedev',color:'#FF5722',region:'overseas',urls:['https://www.reddit.com/r/gamedev/hot/.rss?limit=25']},
 {name:'itch.io Devlogs',color:'#EC4899',region:'overseas',urls:['https://itch.io/devlogs.xml']},
 {name:'indienova',color:'#F43F5E',region:'cn',urls:[gn('site:indienova.com',1),'https://rsshub.app/indienova/article']},
 {name:'GameLook',color:'#3B82F6',region:'cn',urls:['http://www.gamelook.com.cn/feed',gn('site:gamelook.com.cn',1)]},
 {name:'游戏陀螺',color:'#10B981',region:'cn',urls:[gn('site:youxituoluo.com',1)]},
 {name:'GameRes',color:'#F59E0B',region:'cn',urls:[gn('site:gameres.com',1)]},
 {name:'触乐',color:'#8B5CF6',region:'cn',urls:['http://www.chuapp.com/feed',gn('site:chuapp.com',1)]},
];
const PROXY_BUILD=[
 u=>'/proxy?url='+encodeURIComponent(u),
 u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
 u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
];
const CAT_RULES=[
 ['AI',/\b(ai|artificial intelligence|machine learning|llm|generative|gpt|diffusion)\b|生成式|人工智能/i],
 ['引擎 & 技术',/\b(unity|unreal|godot|engine|shader|render(ing)?|graphics|gpu|ray tracing|sdk)\b|引擎|渲染|技术/i],
 ['行业动态',/\b(layoff|acquisition|funding|invest|earnings|revenue|union|lawsuit)\b|裁员|收购|融资|财报|行业|产业|市场/i],
 ['平台 & 发行',/\b(steam|epic games store|playstation|xbox|nintendo|switch|console|game pass|mobile|ios|android)\b|主机|平台|发行|手游/i],
 ['新作 & 发售',/\b(release|launch|announc|trailer|demo|early access|dlc|patch|sequel|reveal)\b|发售|公布|预告|新游|上线|定档/i],
 ['独立开发',/\b(indie|devlog|game ?jam|pixel art|solo dev|kickstarter)\b|独立|独游|开发日志/i],
];
const CATS=['AI','引擎 & 技术','行业动态','平台 & 发行','新作 & 发售','独立开发','综合'];
/* AI 速览板块规则 */
const BUCKETS=[
 {label:'🗓️ 发售 / 定档',re:/发售|定档|上线|发售日|开售|release date|launch(es|ing)?|coming (soon|up)|out (on|in)|dated/i},
 {label:'🎬 PV / 预告片',re:/\bPV\b|预告片|宣传片|trailer|teaser|cinematic|reveal/i},
 {label:'🌸 二游动态',re:/原神|崩坏|星穹铁道|绝区零|明日方舟|鸣潮|碧蓝档案|蔚蓝档案|少女前线|无期迷途|尘白禁区|genshin|honkai|zenless|arknights|wuthering|blue archive|gacha/i},
 {label:'🏢 工作室 / 行业',re:/工作室|裁员|收购|融资|解散|关停|裁员|离职|studio|layoff|acqui|shut(s|ting)? ?down|closes|union|funding/i},
];
const SRC_MAP=Object.fromEntries(SOURCES.map(s=>[s.name,s]));
const CACHE_KEY='gamedev_pulse_v3', PER_SOURCE=12, PAGE_SIZE=10, FETCH_TIMEOUT=8000;
let ALL=[], selSrcs=new Set(), selCats=new Set(), FILTER_Q='', page=1;

/* ================= 工具 ================= */
function hashCode(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0}return Math.abs(h)}
function decodeEntities(s){const t=document.createElement('textarea');t.innerHTML=s;return t.value}
function relTime(ts){const d=Date.now()-ts;if(d<36e5)return Math.max(1,Math.round(d/6e4))+' 分钟前';
  if(d<864e5)return Math.round(d/36e5)+' 小时前';return Math.round(d/864e5)+' 天前'}
function isGn(link){return /news\.google\.com\/rss\/articles/.test(link)}
function decodeGnLink(url){
  try{
    const m=url.match(/articles\/(.+)$/); if(!m)return url;
    let s=m[1].replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    const raw=atob(s);
    const found=raw.match(/https?:\/\/(?!news\.google\.com)[^\s"'<>]+/);
    return found?found[0]:url;
  }catch(e){return url}
}
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200)}

/* ================= 网络（并发竞速提速） ================= */
async function fetchTextFast(rawUrl){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),FETCH_TIMEOUT);
  try{
    const tries=PROXY_BUILD.map(wrap=>
      fetch(wrap(rawUrl),{signal:ctrl.signal})
        .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
        .then(t=>{if(!t||!t.trim().startsWith('<'))throw new Error('bad');return t})
    );
    return await Promise.any(tries);
  }finally{clearTimeout(timer);try{ctrl.abort()}catch(e){}}
}
async function fetchSource(src){
  const tries=src.urls.map(u=>fetchTextFast(u));
  try{
    const xml=await Promise.any(tries);
    return parseFeed(xml,src);
  }catch(e){return []}
}

/* ================= 解析 ================= */
function firstText(node,names){for(const n of names){const el=node.getElementsByTagName(n)[0];
  if(el&&el.textContent.trim())return el}return null}
function extractImage(node,contentHtml){
  const mc=node.getElementsByTagName('media:content')[0]||node.querySelector('content[url]');
  if(mc&&mc.getAttribute('url'))return mc.getAttribute('url');
  const mt=node.getElementsByTagName('media:thumbnail')[0];
  if(mt&&mt.getAttribute('url'))return mt.getAttribute('url');
  for(const e of node.getElementsByTagName('enclosure')){
    const u=e.getAttribute('url'),t=e.getAttribute('type')||'';
    if(u&&(t.startsWith('image')||/\.(jpe?g|png|webp|gif)(\?|$)/i.test(u)))return u;
  }
  if(contentHtml){const m=contentHtml.match(/<img[^>]+src=["']([^"']+)["']/i);if(m)return m[1]}
  return '';
}
function parseFeed(xml,src){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  if(doc.querySelector('parsererror'))throw new Error('parse');
  let nodes=[...doc.getElementsByTagName('item')];
  if(!nodes.length)nodes=[...doc.getElementsByTagName('entry')];
  const out=[];
  for(const node of nodes.slice(0,PER_SOURCE)){
    const titleEl=firstText(node,['title']);
    const linkEl=node.querySelector('link:not([rel])')||node.getElementsByTagName('link')[0];
    let link=linkEl?(linkEl.getAttribute('href')||linkEl.textContent).trim():'';
    let title=decodeEntities((titleEl?titleEl.textContent:'').trim());
    if(!title||!link)continue;
    if(isGn(link)){title=title.replace(/\s+-\s+[^-]{1,40}$/,'');link=decodeGnLink(link)}
    const dateEl=firstText(node,['pubDate','published','updated','dc:date']);
    const descEl=firstText(node,['content:encoded','description','summary','content']);
    const content=descEl?descEl.textContent:'';
    const date=dateEl?new Date(dateEl.textContent.trim()):new Date();
    const text=(title+' '+content).toLowerCase();
    const cat=(CAT_RULES.find(([,re])=>re.test(text))||['综合'])[0];
    out.push({
      id:'a'+hashCode(link),title,link,cat,content,
      summary:decodeEntities(content).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim().slice(0,200),
      image:extractImage(node,content),
      date:isNaN(date)?Date.now():date.getTime(),
      source:src.name,
    });
  }
  return out;
}

/* ================= 聚合（缓存秒开 + 静默刷新） ================= */
async function refresh(silent){
  const btn=document.getElementById('refreshBtn');
  btn.classList.add('loading');btn.disabled=true;
  if(!silent)showSkeleton();
  const t0=performance.now();
  const results=await Promise.all(SOURCES.map(fetchSource));
  const items=results.flat();
  const seen=new Set(),now=Date.now();
  ALL=items.filter(it=>{const k=it.link.split(/[?#]/)[0];
    if(seen.has(k))return false;seen.add(k);
    return now-it.date<21*864e5}).sort((a,b)=>b.date-a.date).slice(0,160);
  const okCount=results.filter(r=>r.length).length;
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({time:now,items:ALL}))}catch(e){}
  document.getElementById('lastUpdated').textContent=
    '更新于 '+new Date(now).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  const sec=((performance.now()-t0)/1000).toFixed(1);
  renderHero();render();buildAISummary();
  btn.classList.remove('loading');btn.disabled=false;
  if(ALL.length)toast(silent?`🔄 后台已更新 ${ALL.length} 条（${sec}s）`
    :`✅ 已聚合 ${ALL.length} 条（${okCount}/${SOURCES.length} 源，${sec}s）`);
  else toast('⚠️ 全部源获取失败，请检查网络或确认 server.py 已运行');
}

/* ================= AI 情报速览 ================= */
function bucketHits(b){return ALL.filter(it=>b.re.test((it.title||'')+' '+(it.summary||'')))}
function renderDigestLocal(){
  const dg=document.getElementById('digest');dg.innerHTML='';
  BUCKETS.forEach(b=>{
    const hits=bucketHits(b).slice(0,4);
    const box=document.createElement('div');box.className='bucket';
    box.innerHTML='<h4>'+b.label+'<span class="cnt">'+hits.length+' 条</span></h4>';
    if(!hits.length){box.innerHTML+='<div class="digest-empty">近期暂无相关条目</div>';}
    else{
      const ul=document.createElement('ul');
      hits.forEach(it=>{
        const li=document.createElement('li');
        const a=document.createElement('a');a.href='javascript:void(0)';a.textContent=it.title;
        a.onclick=()=>{location.hash='#read/'+it.id};
        const s=document.createElement('span');s.className='bsrc';s.textContent=it.source+' · '+relTime(it.date);
        li.append(a,s);ul.appendChild(li);
      });
      box.appendChild(ul);
    }
    dg.appendChild(box);
  });
}
function renderLocalSummaryText(){
  const c=BUCKETS.map(b=>bucketHits(b).length);
  document.getElementById('aiSummary').textContent=
    '近 14 天共聚合 '+ALL.length+' 条资讯：发售/定档 '+c[0]+' 条 · PV/预告 '+c[1]+
    ' 条 · 二游动态 '+c[2]+' 条 · 工作室/行业 '+c[3]+' 条。各板块重点如下：';
}
async function buildAISummary(){
  renderDigestLocal();
  const cfg=JSON.parse(localStorage.getItem('gdv_ai')||'{}');
  if(cfg.base&&cfg.key&&cfg.model){
    const badge=document.getElementById('aiBadge'),sum=document.getElementById('aiSummary');
    badge.textContent='🤖 AI 模型摘要生成中…';
    try{
      const top=ALL.slice(0,40);
      const lines=top.map(it=>'['+it.source+'] '+it.title).join('\n');
      const prompt='你是游戏行业资讯编辑。请基于以下'+top.length+'条近期游戏开发资讯标题，用中文写一段120字以内的总结，重点提及：新游发售日期、二游PV/版本更新、工作室重大新闻（裁员/收购/新作）。只输出总结文字。\n\n'+lines;
      const resp=await fetch('/ai',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({base:cfg.base,key:cfg.key,model:cfg.model,
          messages:[{role:'user',content:prompt}]})});
      if(!resp.ok)throw new Error('fail');
      const data=await resp.json();
      const text=data.choices&&data.choices[0]&&data.choices[0].message.content.trim();
      if(text){sum.textContent=text;badge.textContent='🤖 AI 模型摘要';return}
      throw new Error('empty');
    }catch(e){badge.textContent='🧠 本地智能摘要（AI 调用失败）'}
  }
  renderLocalSummaryText();
}

/* ================= 筛选（多选） ================= */
function buildChips(){
  const rowO=document.getElementById('rowOverseas'),rowC=document.getElementById('rowCN'),
        rowCat=document.getElementById('rowCat');
  SOURCES.forEach(s=>{
    const b=document.createElement('button');b.className='chip';b.dataset.src=s.name;
    b.innerHTML='<span class="src-dot" style="background:'+s.color+'"></span>'+s.name;
    (s.region==='cn'?rowC:rowO).appendChild(b);
  });
  CATS.forEach(c=>{
    const b=document.createElement('button');b.className='chip';b.dataset.cat=c;b.textContent=c;
    rowCat.insertBefore(b,rowCat.querySelector('.search'));
  });
}
function getFiltered(){
  const q=FILTER_Q.toLowerCase();
  return ALL.filter(it=>{
    if(selSrcs.size&&!selSrcs.has(it.source))return false;
    if(selCats.size&&!selCats.has(it.cat))return false;
    if(q&&!(it.title+it.summary+it.source).toLowerCase().includes(q))return false;
    return true;
  });
}

/* ================= 渲染 ================= */
function renderHero(){
  const stats=document.getElementById('aiSummary');
  if(!ALL.length)stats.textContent='暂无数据';
}
function makeCard(it,idx){
  const card=document.createElement('article');
  card.className='card glass';card.style.animationDelay=Math.min(idx*40,300)+'ms';
  card.onclick=()=>{location.hash='#read/'+it.id};
  const thumb=document.createElement('div');thumb.className='thumb';
  const ph=document.createElement('div');ph.className='ph';ph.textContent='🎮';
  thumb.appendChild(ph);
  if(it.image){
    const img=new Image();img.loading='lazy';img.referrerPolicy='no-referrer';img.alt=it.title;
    img.src=it.image;img.onload=()=>ph.remove();img.onerror=()=>img.remove();
    thumb.appendChild(img);
  }
  const tag=document.createElement('span');tag.className='cat-tag';tag.textContent=it.cat;
  thumb.appendChild(tag);
  const body=document.createElement('div');body.className='body';
  const sc=(SRC_MAP[it.source]||{}).color||'#888';
  const meta=document.createElement('div');meta.className='meta';
  meta.innerHTML='<span class="src-dot" style="background:'+sc+'"></span><span>'+it.source+
    '</span><span class="time">'+relTime(it.date)+'</span>';
  const h3=document.createElement('h3');h3.textContent=it.title;
  const p=document.createElement('p');p.className='summary';
  p.textContent=it.summary||'（无摘要，点击查看详情）';
  const foot=document.createElement('div');foot.className='foot';
  foot.innerHTML='<span class="link">阅读全文 →</span>';
  body.append(meta,h3,p,foot);card.append(thumb,body);
  return card;
}
function render(){
  const grid=document.getElementById('grid');grid.innerHTML='';
  const filtered=getFiltered();
  const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
  if(page>totalPages)page=totalPages;
  renderPagination(filtered.length,totalPages);
  const start=(page-1)*PAGE_SIZE;
  const pageItems=filtered.slice(start,start+PAGE_SIZE);
  if(!pageItems.length){
    grid.innerHTML='<div class="empty"><div class="big">🕹️</div><p>暂无匹配的资讯，调整筛选条件试试～</p></div>';
    return;
  }
  pageItems.forEach((it,i)=>grid.appendChild(makeCard(it,i)));
}
function genPageNums(cur,total){
  if(total<=7)return Array.from({length:total},(_,i)=>i+1);
  const set=new Set([1,2,total-1,total,cur-1,cur,cur+1]);
  const arr=[...set].filter(n=>n>=1&&n<=total).sort((a,b)=>a-b);
  const out=[];let prev=0;
  for(const n of arr){if(n-prev>1)out.push('…');out.push(n);prev=n}
  return out;
}
function renderPagination(count,totalPages){
  const pg=document.getElementById('pagination');pg.innerHTML='';
  if(totalPages<=1){pg.style.display='none';return}
  pg.style.display='flex';
  const info=document.createElement('span');info.className='page-info';
  info.textContent='第 '+page+'/'+totalPages+' 页 · 共 '+count+' 条';
  pg.appendChild(info);
  const mkBtn=(label,target,disabled,cur)=>{
    const b=document.createElement('button');b.className='pg-btn'+(cur?' cur':'');
    b.textContent=label;b.disabled=disabled;
    if(!disabled&&!cur)b.onclick=()=>{page=target;render();window.scrollTo({top:0,behavior:'smooth'})};
    return b;
  };
  pg.appendChild(mkBtn('«',1,page===1));
  pg.appendChild(mkBtn('‹',page-1,page===1));
  genPageNums(page,totalPages).forEach(n=>{
    if(n==='…'){const s=document.createElement('span');s.textContent='…';pg.appendChild(s)}
    else pg.appendChild(mkBtn(n,n,false,n===page));
  });
  pg.appendChild(mkBtn('›',page+1,page===totalPages));
  pg.appendChild(mkBtn('»',totalPages,page===totalPages));
}
function showSkeleton(){
  const grid=document.getElementById('grid');grid.innerHTML='';
  for(let i=0;i<5;i++){
    const s=document.createElement('div');s.className='skel glass';
    s.innerHTML='<div class="s-img"></div><div class="s-lines"><div class="s-line w40"></div><div class="s-line w90"></div><div class="s-line w70"></div></div>';
    grid.appendChild(s);
  }
}

/* ================= 阅读界面 ================= */
function articleParagraphs(html){
  if(!html)return[];
  let t=html.replace(/<(script|style)[\s\S]*?<\/\1>/gi,'')
    .replace(/<(br|\/p|\/div|\/h[1-6]|\/li|\/blockquote)[^>]*>/gi,'\n')
    .replace(/<[^>]+>/g,' ');
  t=decodeEntities(t);
  return t.split(/\n+/).map(s=>s.replace(/\s+/g,' ').trim()).filter(s=>s.length>1).slice(0,40);
}
function openReader(id){
  const it=ALL.find(a=>a.id===id);
  if(!it){location.hash='';return}
  const sc=(SRC_MAP[it.source]||{}).color||'#888';
  document.getElementById('rMeta').innerHTML=
    '<span class="pill"><span class="src-dot" style="background:'+sc+'"></span>'+it.source+
    '</span><span class="pill">🏷 '+it.cat+'</span><span class="pill">🕐 '+relTime(it.date)+'</span>';
  document.getElementById('rTitle').textContent=it.title;
  const rLink=document.getElementById('rLink');rLink.href=it.link;
  let host=it.link;try{host=new URL(it.link).hostname}catch(e){}
  rLink.innerHTML='🔗 原文链接：<span style="text-decoration:underline">'+host+'</span>&nbsp;·&nbsp;'+it.link;
  const fig=document.getElementById('rFigure');fig.innerHTML='';
  if(it.image){
    const img=new Image();img.referrerPolicy='no-referrer';img.alt=it.title;img.src=it.image;
    img.onerror=()=>{fig.innerHTML='<div class="ph">🎮</div>'};
    fig.appendChild(img);
  }else fig.innerHTML='<div class="ph">🎮</div>';
  const rBody=document.getElementById('rBody');rBody.innerHTML='';
  const paras=articleParagraphs(it.content);
  if(paras.length)paras.forEach(tx=>{const p=document.createElement('p');p.textContent=tx;rBody.appendChild(p)});
  else{const p=document.createElement('p');p.textContent='该来源未提供正文内容，请通过上方原文链接查看完整报道。';rBody.appendChild(p)}
  document.getElementById('rOpen').href=it.link;
  document.getElementById('listView').hidden=true;
  document.getElementById('readerView').hidden=false;
  window.scrollTo({top:0});
}
function closeReader(){
  document.getElementById('readerView').hidden=true;
  document.getElementById('listView').hidden=false;
}
function route(){
  if(location.hash.startsWith('#read/'))openReader(location.hash.slice(6));
  else closeReader();
}
window.addEventListener('hashchange',route);
document.getElementById('backBtn').onclick=()=>{location.hash=''};

/* ================= 外观设置 ================= */
const SWATCHES=['#0F172A','#1E1B2E','#111827','#0B3D2E','#3E2723','#263238','#F5F0FA','#ECEFF1'];
function luminance(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return(0.299*r+0.587*g+0.114*b)/255;
}
function applyAppearance(cfg){
  const root=document.documentElement;
  if(cfg.bg)root.dataset.bg=cfg.bg;
  if(cfg.font)root.dataset.font=cfg.font;
  if(cfg.fs)root.dataset.fs=cfg.fs;
  if(cfg.solid)root.style.setProperty('--solid',cfg.solid);
  if(cfg.bg==='solid'&&cfg.solid)
    applyTheme(luminance(cfg.solid)>0.6?'light':'dark');
}
function loadSettings(){
  const cfg=JSON.parse(localStorage.getItem('gdv_appearance')||'{}');
  applyAppearance(cfg);
  return cfg;
}
function markOpts(cfg){
  document.querySelectorAll('#bgOpts .opt').forEach(b=>b.classList.toggle('active',b.dataset.bg===cfg.bg));
  document.querySelectorAll('#fontOpts .opt').forEach(b=>b.classList.toggle('active',b.dataset.font===cfg.font));
  document.querySelectorAll('#fsOpts .opt').forEach(b=>b.classList.toggle('active',b.dataset.fs===cfg.fs));
  document.getElementById('swatches').style.display=cfg.bg==='solid'?'flex':'none';
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s.dataset.color===cfg.solid));
}
function openSettings(){
  const cfg=loadSettings();
  document.getElementById('aiUrl').value=(JSON.parse(localStorage.getItem('gdv_ai')||'{}').base)||'';
  document.getElementById('aiKey').value=(JSON.parse(localStorage.getItem('gdv_ai')||'{}').key)||'';
  document.getElementById('aiModel').value=(JSON.parse(localStorage.getItem('gdv_ai')||'{}').model)||'';
  markOpts(cfg);
  document.getElementById('settingsModal').classList.add('show');
}
document.getElementById('settingsBtn').onclick=openSettings;
document.getElementById('settingsClose').onclick=()=>document.getElementById('settingsModal').classList.remove('show');
document.getElementById('settingsModal').onclick=e=>{if(e.target.id==='settingsModal')e.target.classList.remove('show')};
document.getElementById('bgOpts').onclick=e=>{
  const b=e.target.closest('.opt');if(!b)return;
  const cfg=loadSettings();cfg.bg=b.dataset.bg;
  localStorage.setItem('gdv_appearance',JSON.stringify(cfg));
  applyAppearance(cfg);markOpts(cfg);
};
document.getElementById('fontOpts').onclick=e=>{
  const b=e.target.closest('.opt');if(!b)return;
  const cfg=loadSettings();cfg.font=b.dataset.font;
  localStorage.setItem('gdv_appearance',JSON.stringify(cfg));
  applyAppearance(cfg);markOpts(cfg);
};
document.getElementById('fsOpts').onclick=e=>{
  const b=e.target.closest('.opt');if(!b)return;
  const cfg=loadSettings();cfg.fs=b.dataset.fs;
  localStorage.setItem('gdv_appearance',JSON.stringify(cfg));
  applyAppearance(cfg);markOpts(cfg);
};
document.getElementById('swatches').onclick=e=>{
  const s=e.target.closest('.swatch');if(!s)return;
  const cfg=loadSettings();cfg.solid=s.dataset.color;
  localStorage.setItem('gdv_appearance',JSON.stringify(cfg));
  applyAppearance(cfg);markOpts(cfg);
};
document.getElementById('settingsSave').onclick=()=>{
  const ai={base:document.getElementById('aiUrl').value.trim(),
    key:document.getElementById('aiKey').value.trim(),
    model:document.getElementById('aiModel').value.trim()};
  localStorage.setItem('gdv_ai',JSON.stringify(ai));
  document.getElementById('settingsModal').classList.remove('show');
  toast('✅ 设置已保存');
  buildAISummary();
};

/* ================= 主题 ================= */
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('gdv_theme',t)}
document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.dataset.theme;
  const isDark=cur==='dark'||(cur==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  applyTheme(isDark?'light':'dark');
};
if(localStorage.getItem('gdv_theme'))applyTheme(localStorage.getItem('gdv_theme'));
else if(matchMedia('(prefers-color-scheme: dark)').matches)applyTheme('dark');

/* ================= 交互 ================= */
document.getElementById('refreshBtn').onclick=()=>refresh(false);
document.querySelector('.toolbar').addEventListener('click',e=>{
  const chip=e.target.closest('.chip');if(!chip)return;
  if(chip.dataset.src){
    const s=chip.dataset.src;
    if(selSrcs.has(s)){selSrcs.delete(s);chip.classList.remove('active')}
    else{selSrcs.add(s);chip.classList.add('active')}
  }else if(chip.dataset.cat){
    const c=chip.dataset.cat;
    if(selCats.has(c)){selCats.delete(c);chip.classList.remove('active')}
    else{selCats.add(c);chip.classList.add('active')}
  }
  page=1;render();
});
document.getElementById('resetBtn').onclick=()=>{
  selSrcs.clear();selCats.clear();FILTER_Q='';page=1;
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  render();
};
document.getElementById('searchInput').oninput=e=>{FILTER_Q=e.target.value.trim();page=1;render()};

/* ================= 启动 ================= */
buildChips();
SWATCHES.forEach(c=>{
  const s=document.createElement('div');s.className='swatch';s.dataset.color=c;
  s.style.background=c;document.getElementById('swatches').appendChild(s);
});
loadSettings();
(function init(){
  try{
    const cache=JSON.parse(localStorage.getItem(CACHE_KEY));
    if(cache&&cache.items&&cache.items.length&&Date.now()-cache.time<24*36e5){
      ALL=cache.items;
      document.getElementById('lastUpdated').textContent=
        '更新于 '+new Date(cache.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
      render();buildAISummary();route();
      toast('📦 已加载缓存，正在后台静默刷新…');
      refresh(true);   // 后台静默刷新，不打断阅读
      return;
    }
  }catch(e){}
  refresh(false).then(route);
})();
</script>
</body>
</html>
